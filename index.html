<!DOCTYPE html>
<html lang="fr">
<head>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('mellohub_theme') || 'auto';
      var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mello Hub">
<meta name="theme-color" content="#0B1A30">
<title>Mello Hub</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5FA;
    --card:#FFFFFF;
    --card-glass:rgba(255,255,255,0.66);
    --ink:#0E1B2C;
    --muted:#5B6B82;
    --border:rgba(14,27,44,0.09);
    --accent:#1B4B8F;
    --accent-2:#5C7FB0;
    --accent-soft:rgba(27,75,143,0.10);
    --positive:#1C9A6C;
    --positive-soft:rgba(28,154,108,0.12);
    --negative:#D6455A;
    --negative-soft:rgba(214,69,90,0.12);
    --alert:#DB9A2C;
    --alert-soft:rgba(219,154,44,0.14);
    --radius:16px;
    --radius-sm:11px;
    --shadow-soft: 0 10px 30px rgba(14,27,44,0.08);
  }
  [data-theme="dark"]{
    --bg:#080F1C;
    --card:#111F35;
    --card-glass:rgba(17,31,53,0.62);
    --ink:#EAF0FA;
    --muted:#8FA3BE;
    --border:rgba(255,255,255,0.08);
    --accent:#6C9BE0;
    --accent-2:#8FA8C9;
    --accent-soft:rgba(108,155,224,0.14);
    --positive:#3FC08C;
    --positive-soft:rgba(63,192,140,0.14);
    --negative:#F2717F;
    --negative-soft:rgba(242,113,127,0.14);
    --alert:#F0B84C;
    --alert-soft:rgba(240,184,76,0.16);
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  h1,h2,h3,h4{font-weight:700;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  .app{display:flex;min-height:100dvh;}

  /* ---------- Sidebar / Nav (shared markup, two layouts) ---------- */
  .sidebar{
    width:236px;flex-shrink:0;position:sticky;top:0;height:100dvh;
    padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.75rem;
    border-right:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:.65rem;padding:0 .35rem;}
  .brand-badge{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 30% 20%, #24467E 0%, #0D2547 60%, #081A34 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 10px rgba(8,26,52,0.35);
  }
  .brand-badge::before,.brand-badge::after{
    content:"";position:absolute;border:1px solid rgba(255,255,255,0.28);border-radius:50%;
  }
  .brand-badge::before{width:60px;height:60px;top:-18px;left:-10px;}
  .brand-badge::after{width:60px;height:60px;bottom:-30px;right:-14px;}
  .brand-badge span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:.62rem;letter-spacing:.03em;
    background:linear-gradient(135deg,#EAF1FC,#9FB4D6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-name{font-weight:700;font-size:1rem;line-height:1.1;}
  .brand-sub{font-size:.68rem;color:var(--muted);font-weight:500;}

  .nav{position:relative;display:flex;flex-direction:column;gap:.15rem;padding:.35rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .nav-pill{
    position:absolute;top:0;left:0;border-radius:9px;z-index:0;
    background: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 16px rgba(27,75,143,0.30);
  }
  .nav-item{
    position:relative;z-index:1;display:flex;align-items:center;gap:.7rem;
    padding:.62rem .75rem;border-radius:9px;cursor:pointer;color:var(--muted);
    font-size:.86rem;font-weight:600;transition:color .25s ease;user-select:none;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item.active{color:#fff;}
  .nav-item:not(.active):hover{color:var(--ink);}
  .nav-label-full{display:inline;}
  .nav-label-compact{display:none;}

  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:.6rem;}
  .theme-toggle{
    display:flex;gap:.25rem;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.25rem;
  }
  .theme-btn{
    flex:1;border:none;background:transparent;border-radius:7px;padding:.4rem 0;cursor:pointer;
    color:var(--muted);font-size:.85rem;display:flex;align-items:center;justify-content:center;
  }
  .theme-btn.active{background:var(--accent-soft);color:var(--accent);}
  .theme-btn svg{width:15px;height:15px;}
  .foot-note{font-size:.66rem;color:var(--muted);padding:0 .35rem;line-height:1.4;}

  /* ---------- Main content ---------- */
  .main{flex:1;min-width:0;padding:calc(1.75rem + env(safe-area-inset-top, 0px)) 2.25rem calc(3rem + env(safe-area-inset-bottom,0px));}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap;}
  .eyebrow{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;}
  .page-title{font-size:1.7rem;}
  .page-sub{color:var(--muted);font-size:.88rem;margin-top:.35rem;}
  .topbar-actions{display:flex;gap:.6rem;align-items:center;}

  .btn{
    border:none;border-radius:11px;padding:.65rem 1rem;font-weight:600;font-size:.85rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:.45rem;transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(27,75,143,0.28);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-danger-text{background:transparent;color:var(--negative);padding:.4rem .5rem;}
  .btn svg{width:15px;height:15px;}

  .segmented{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.2rem;gap:.15rem;}
  .segmented button{border:none;background:transparent;padding:.45rem .8rem;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;}
  .segmented button.active{background:var(--accent-soft);color:var(--accent);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:1rem;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);margin-bottom:1.4rem;}
  .card{
    background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);
    padding:1.15rem 1.3rem;box-shadow:var(--shadow-soft);
  }
  .kpi-card{display:flex;flex-direction:column;gap:.55rem;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:17px;height:17px;}
  .kpi-value{font-size:1.55rem;font-weight:700;}
  .kpi-label{font-size:.78rem;color:var(--muted);font-weight:500;}
  .kpi-delta{font-size:.72rem;font-weight:600;padding:.15rem .5rem;border-radius:20px;width:fit-content;}

  .section-title{font-size:1.02rem;font-weight:700;margin:0 0 .85rem;display:flex;align-items:center;justify-content:space-between;}
  .section-title span.count{color:var(--muted);font-weight:500;font-size:.8rem;}

  .two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;align-items:start;}

  /* Upcoming offer mini cards */
  .offer-mini{display:flex;align-items:center;gap:.85rem;padding:.7rem .5rem;border-radius:12px;transition:background .15s;}
  .offer-mini:hover{background:var(--accent-soft);}
  .offer-mini + .offer-mini{border-top:1px solid var(--border);}
  .offer-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .offer-mini-title{font-weight:600;font-size:.86rem;}
  .offer-mini-sub{font-size:.74rem;color:var(--muted);margin-top:.1rem;}
  .offer-mini-badge{margin-left:auto;font-size:.7rem;font-weight:700;padding:.28rem .6rem;border-radius:20px;white-space:nowrap;}
  .empty-state{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.85rem;}
  .empty-state svg{width:32px;height:32px;margin-bottom:.6rem;opacity:.5;}

  /* Bar chart */
  .chart-wrap{position:relative;}
  .bar-row{display:flex;align-items:flex-end;gap:.65rem;height:120px;padding-top:.5rem;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.4rem;height:100%;justify-content:flex-end;}
  .bar-shape{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent-2),var(--accent));min-height:4px;}
  .bar-label{font-size:.66rem;color:var(--muted);font-weight:600;}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-soft);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  thead th{
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    font-weight:700;padding:.85rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:.8rem 1rem;font-size:.86rem;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  .cell-title{font-weight:600;}
  .cell-sub{color:var(--muted);font-size:.72rem;margin-top:.15rem;}
  .badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;padding:.3rem .65rem;border-radius:20px;}
  .row-actions{display:flex;gap:.3rem;justify-content:flex-end;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn.danger:hover{background:var(--negative-soft);color:var(--negative);}
  .icon-btn svg{width:15px;height:15px;}
  .tag-chip{font-size:.7rem;font-weight:600;padding:.22rem .55rem;border-radius:8px;background:var(--accent-soft);color:var(--accent);}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .cal-nav{display:flex;gap:.4rem;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;}
  .cal-dow{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding-bottom:.3rem;}
  .cal-day{
    aspect-ratio:1/0.82;border-radius:10px;border:1px solid transparent;padding:.4rem;position:relative;
    font-size:.78rem;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink);
  }
  [data-theme="dark"] .cal-day{background:rgba(255,255,255,0.03);}
  .cal-day.outside{opacity:.35;}
  .cal-day.today{border-color:var(--accent);}
  .cal-day.selected{background:var(--accent);color:#fff;}
  .cal-day-dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px;}
  .cal-day-dots span{width:5px;height:5px;border-radius:50%;}
  .cal-day-list{margin-top:1.1rem;}

  /* ---------- Omnibus editable table ---------- */
  .omni-table td, .omni-table th{white-space:nowrap;}
  .omni-crit{position:sticky;left:0;background:var(--card);z-index:2;min-width:210px;font-weight:600;}
  thead .omni-crit{z-index:3;}
  .cell-input{
    border:1px solid transparent;background:transparent;font-family:inherit;font-size:.85rem;color:var(--ink);
    padding:.4rem .5rem;border-radius:8px;width:100%;min-width:130px;
  }
  .cell-input:hover{border-color:var(--border);}
  .cell-input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft);}
  .col-head-wrap{display:flex;align-items:center;gap:.3rem;}
  .col-head-wrap .cell-input{font-weight:700;min-width:150px;}
  .add-col-btn{
    display:flex;align-items:center;justify-content:center;gap:.4rem;min-width:120px;border:1.5px dashed var(--border);
    border-radius:10px;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:.7rem;background:transparent;
  }
  .add-col-btn:hover{border-color:var(--accent);color:var(--accent);}
  .omni-note{
    display:flex;gap:.7rem;background:var(--alert-soft);border:1px solid rgba(219,154,44,0.3);
    border-radius:var(--radius-sm);padding:.85rem 1rem;font-size:.8rem;color:var(--ink);margin-bottom:1.1rem;align-items:flex-start;
  }
  .omni-note svg{width:17px;height:17px;flex-shrink:0;color:var(--alert);margin-top:.1rem;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,12,24,0.45);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--card);border-radius:18px;width:100%;max-width:440px;padding:1.5rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);transform:translateY(12px) scale(.98);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);
    max-height:88vh;overflow-y:auto;
  }
  .modal-backdrop.open .modal{transform:translateY(0) scale(1);opacity:1;}
  .modal-title{font-size:1.05rem;margin-bottom:1.1rem;}
  .field{margin-bottom:.9rem;}
  .field label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;}
  .field input[type=text], .field input[type=date], .field select{
    width:100%;padding:.65rem .75rem;border-radius:10px;border:1px solid var(--border);background:var(--bg);
    color:var(--ink);font-family:inherit;font-size:.85rem;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .swatch-row{display:flex;gap:.5rem;}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.selected{border-color:var(--ink);}
  .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.3rem;}

  /* toast */
  .toast-wrap{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.5rem;align-items:center;}
  .toast{
    background:var(--card-glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border:0.5px solid var(--border);color:var(--ink);padding:.7rem 1.1rem;border-radius:30px;font-size:.82rem;font-weight:600;
    box-shadow:0 10px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
    display:flex;align-items:center;gap:.5rem;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .toast.error{color:var(--negative);}
  .toast.success{color:var(--positive);}

  .view-fade{animation:viewFade .35s ease both;}
  @keyframes viewFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Lock screen ---------- */
  .lock-screen{
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
    background:radial-gradient(120% 100% at 30% 0%, #17335F 0%, #0B1A30 55%, #060E1D 100%);
    position:relative;overflow:hidden;
  }
  .lock-arc{position:absolute;border:1px solid rgba(255,255,255,0.08);border-radius:50%;}
  .lock-arc.a1{width:520px;height:520px;top:-260px;left:-160px;}
  .lock-arc.a2{width:640px;height:640px;bottom:-360px;right:-200px;}
  .lock-arc.a3{width:380px;height:380px;top:40%;right:10%;}
  .lock-card{
    position:relative;z-index:1;width:100%;max-width:360px;padding:2.1rem 1.9rem;border-radius:22px;
    background:rgba(17,31,53,0.55);border:0.5px solid rgba(255,255,255,0.12);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14);
    text-align:center;color:#fff;
  }
  .lock-badge{width:56px;height:56px;border-radius:15px;margin:0 auto 1.1rem;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 30% 20%, #2E5290 0%, #0D2547 60%, #081A34 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 16px rgba(8,26,52,0.4);}
  .lock-badge::before,.lock-badge::after{content:"";position:absolute;border:1px solid rgba(255,255,255,0.3);border-radius:50%;}
  .lock-badge::before{width:88px;height:88px;top:-26px;left:-16px;}
  .lock-badge::after{width:88px;height:88px;bottom:-44px;right:-20px;}
  .lock-badge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;letter-spacing:.03em;
    background:linear-gradient(135deg,#EAF1FC,#9FB4D6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lock-title{font-size:1.2rem;font-weight:700;margin-bottom:.3rem;}
  .lock-sub{font-size:.8rem;color:rgba(255,255,255,0.6);margin-bottom:1.5rem;}
  .lock-field{position:relative;margin-bottom:.9rem;}
  .lock-field input{
    width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.06);color:#fff;font-family:inherit;font-size:.92rem;text-align:center;
    letter-spacing:.04em;
  }
  .lock-field input::placeholder{color:rgba(255,255,255,0.35);}
  .lock-field input:focus{outline:none;border-color:#6C9BE0;background:rgba(255,255,255,0.1);}
  .lock-error{font-size:.76rem;color:#F2717F;min-height:1.1rem;margin-bottom:.6rem;}
  .lock-btn{
    width:100%;padding:.85rem;border-radius:12px;border:none;background:linear-gradient(135deg,#3E6FB5,#1B4B8F);
    color:#fff;font-weight:700;font-size:.88rem;cursor:pointer;box-shadow:0 10px 24px rgba(27,75,143,0.4);
    display:flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .15s ease;
  }
  .lock-btn:active{transform:scale(.97);}
  .lock-btn svg{width:16px;height:16px;}
  .lock-shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

  /* ---------- Réglages ---------- */
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:.95rem 0;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap;}
  .settings-row:last-child{border-bottom:none;}
  .settings-label{font-weight:600;font-size:.88rem;}
  .settings-sub{font-size:.76rem;color:var(--muted);margin-top:.15rem;}
  .version-pill{font-size:.72rem;font-weight:700;padding:.3rem .7rem;border-radius:20px;background:var(--accent-soft);color:var(--accent);}
  .changelog-item{padding:.75rem 0;border-bottom:1px solid var(--border);}
  .changelog-item:last-child{border-bottom:none;}
  .changelog-version{font-weight:700;font-size:.85rem;}
  .changelog-date{font-size:.72rem;color:var(--muted);margin-left:.5rem;}
  .changelog-notes{font-size:.8rem;color:var(--muted);margin-top:.3rem;line-height:1.5;}

  /* ---------- Mobile ---------- */
  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}

  @media (max-width:760px){

<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<div id="toast-wrap" class="toast-wrap"></div>

<script>
/* =========================================================
   MELLO HUB — dashboard interne Mello Matelas
   Architecture: fichier unique, vanilla JS, localStorage,
   PWA installable — voir "Fiche technique Cockpit"
   ========================================================= */

/* ---------------- Storage helpers ---------------- */
function loadJSON(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ toast("Impossible d'enregistrer les données.", "error"); return false; }
}
function uid(){ return Math.random().toString(36).slice(2,10); }

const STORAGE = {
  offres: 'mellohub_offres',
  omnibus: 'mellohub_omnibus',
  theme: 'mellohub_theme',
  view: 'mellohub_lastview',
  unlocked: 'mellohub_unlocked'
};

/* ---------------- Version & changelog ---------------- */
const APP_VERSION = '1.0.1';
const CHANGELOG = [
  { version:'1.0.1', date:'Août 2026', notes:"Ajout de l'écran de verrouillage commun et de la page Réglages." },
  { version:'1.0.0', date:'Août 2026', notes:'Première version : Tableau de bord, Offres et Omnibus.' }
];

/* ---------------- Accès protégé par mot de passe ----------------
   Le mot de passe n'est jamais stocké en clair : seule son empreinte
   SHA-256 est comparée à celle saisie par l'utilisateur. */
const ACCESS_HASH = '91dcdf174d85b852069eff7890f683e400651df14f54b892b71a6f7a70e524f0';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function isUnlocked(){ return sessionStorage.getItem(STORAGE.unlocked) === 'true' || localStorage.getItem(STORAGE.unlocked) === 'true'; }

/* ---------------- Seed data ---------------- */
function seedOffres(){
  const today = new Date();
  const d = (offset) => { const x = new Date(today); x.setDate(x.getDate()+offset); return x.toISOString().slice(0,10); };
  return [
    { id: uid(), title:"Soldes d'été", tag:"Soldes", start:d(-5), end:d(9), color:"#1B4B8F" },
    { id: uid(), title:"Mello Days", tag:"Temps fort", start:d(14), end:d(21), color:"#DB9A2C" },
    { id: uid(), title:"Au Lit Days", tag:"Temps fort", start:d(35), end:d(40), color:"#1C9A6C" },
    { id: uid(), title:"Avant-première Black Friday", tag:"Avant-première", start:d(60), end:d(63), color:"#D6455A" }
  ];
}
function seedOmnibus(){
  return {
    columns:[
      { id:'colA', label:'Produit à compléter' }
    ],
    rows:[
      { id:'r1', label:'Prix affiché', cells:{} },
      { id:'r2', label:'Prix de référence (30 derniers jours)', cells:{} },
      { id:'r3', label:'Réduction affichée', cells:{} },
      { id:'r4', label:'Réduction réelle constatée', cells:{} },
      { id:'r5', label:'Conformité Omnibus', cells:{} }
    ]
  };
}

let state = {
  offres: loadJSON(STORAGE.offres, null) || seedOffres(),
  omnibus: loadJSON(STORAGE.omnibus, null) || seedOmnibus(),
  currentView: loadJSON(STORAGE.view, 'dashboard'),
  calMonth: (() => { const n = new Date(); return { y:n.getFullYear(), m:n.getMonth() }; })(),
  calSelected: null,
  offresViewMode: 'table'
};
if(!loadJSON(STORAGE.offres, null)) saveJSON(STORAGE.offres, state.offres);
if(!loadJSON(STORAGE.omnibus, null)) saveJSON(STORAGE.omnibus, state.omnibus);

function persistOffres(){ saveJSON(STORAGE.offres, state.offres); }
function persistOmnibus(){ saveJSON(STORAGE.omnibus, state.omnibus); }

/* ---------------- Icons (inline SVG, stroke-based) ---------------- */
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  offres: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/><path d="M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg>',
  omnibus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 6h6v6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  chevronL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevronR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  flash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  alertTri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/><path d="m9 14 2 2 4-4"/></svg>',
  table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l18 12"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16v9H4z"/><path d="M8 12V7a4 4 0 0 1 7.2-2.4"/></svg>'
};

const NAV_ITEMS = [
  { id:'dashboard', label:'Tableau de bord', short:'Accueil', icon: ICONS.dashboard },
  { id:'offres', label:'Offres', short:'Offres', icon: ICONS.offres },
  { id:'omnibus', label:'Omnibus', short:'Omnibus', icon: ICONS.omnibus },
  { id:'reglages', label:'Réglages', short:'Réglages', icon: ICONS.gear }
];

/* ---------------- Utils ---------------- */
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()].slice(0,3); }
function fmtDateLong(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()] + ' ' + d.getFullYear(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function offerStatus(o){
  const t = todayStr();
  if(o.end < t) return 'passee';
  if(o.start <= t && o.end >= t) return 'active';
  return 'avenir';
}
const STATUS_META = {
  avenir: { label:'À venir', color:'var(--accent)', soft:'var(--accent-soft)' },
  active: { label:'En cours', color:'var(--positive)', soft:'var(--positive-soft)' },
  passee: { label:'Terminée', color:'var(--muted)', soft:'rgba(91,107,130,0.12)' }
};
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Toasts ---------------- */
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = (kind==='success'?ICONS.check:kind==='error'?ICONS.alertTri:'') + '<span>' + escapeHtml(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(8px)'; el.style.transition='all .25s ease'; setTimeout(()=>el.remove(), 250); }, 2200);
}

/* ================= LOCK SCREEN ================= */
function renderLock(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-arc a1"></div><div class="lock-arc a2"></div><div class="lock-arc a3"></div>
      <div class="lock-card">
        <div class="lock-badge"><span>HUB</span></div>
        <div class="lock-title">Mello Hub</div>
        <div class="lock-sub">Accès réservé à l'équipe Mello</div>
        <div class="lock-field">
          <input type="password" id="lock-input" placeholder="Mot de passe" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="lock-error" id="lock-error"></div>
        <label style="display:flex;align-items:center;gap:.45rem;justify-content:center;margin-bottom:1rem;font-size:.75rem;color:rgba(255,255,255,0.55);">
          <input type="checkbox" id="lock-remember" checked style="accent-color:#6C9BE0;">
          Rester connecté sur cet appareil
        </label>
        <button class="lock-btn" id="lock-submit">${ICONS.unlock} Déverrouiller</button>
      </div>
    </div>
  `;
  const input = document.getElementById('lock-input');
  const errorEl = document.getElementById('lock-error');
  const card = document.querySelector('.lock-card');
  input.focus();

  async function attempt(){
    const value = input.value;
    if(!value) return;
    const hash = await sha256Hex(value);
    if(hash === ACCESS_HASH){
      const remember = document.getElementById('lock-remember').checked;
      if(remember) localStorage.setItem(STORAGE.unlocked, 'true');
      else sessionStorage.setItem(STORAGE.unlocked, 'true');
      renderShell();
    }else{
      errorEl.textContent = 'Mot de passe incorrect.';
      card.classList.remove('lock-shake'); void card.offsetWidth; card.classList.add('lock-shake');
      input.value=''; input.focus();
    }
  }
  document.getElementById('lock-submit').addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') attempt(); });
}

function lockApp(){
  localStorage.removeItem(STORAGE.unlocked);
  sessionStorage.removeItem(STORAGE.unlocked);
  renderLock();
}

/* ================= RENDER: SHELL ================= */
function renderShell(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge"><span>HUB</span></div>
        <div>
          <div class="brand-name">Mello Hub</div>
          <div class="brand-sub">Outil interne</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-pill" id="nav-pill"></div>
        ${NAV_ITEMS.map(it => `
          <div class="nav-item${state.currentView===it.id?' active':''}" data-action="go-view" data-view="${it.id}">
            ${it.icon}
            <span class="nav-label-full">${it.label}</span>
            <span class="nav-label-compact">${it.short}</span>
          </div>`).join('')}
      </nav>
      <div class="sidebar-foot">
        ${renderThemeToggle()}
        <div class="foot-note">Mello Matelas · usage interne</div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  `;
  renderView();
  attachGlobalHandlers();
  requestAnimationFrame(() => { positionPill(true); });
}

function renderThemeToggle(){
  const current = loadJSON(STORAGE.theme, 'auto');
  const opts = [ {k:'light',icon:ICONS.sun}, {k:'auto',icon:ICONS.auto}, {k:'dark',icon:ICONS.moon} ];
  return `<div class="theme-toggle">
    ${opts.map(o => `<button class="theme-btn${current===o.k?' active':''}" data-action="set-theme" data-theme="${o.k}" title="${o.k}">${o.icon}</button>`).join('')}
  </div>`;
}

function applyTheme(){
  const saved = loadJSON(STORAGE.theme, 'auto');
  const isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
}

function positionPill(skipTransition){
  const pill = document.getElementById('nav-pill');
  const nav = document.getElementById('nav');
  const active = nav.querySelector('.nav-item.active');
  if(!pill || !active) return;
  if(skipTransition) pill.style.transition = 'none';
  const itemRect = active.getBoundingClientRect();
  const parentRect = nav.getBoundingClientRect();
  pill.style.width = itemRect.width + 'px';
  pill.style.height = itemRect.height + 'px';
  pill.style.transform = `translate(${itemRect.left - parentRect.left}px, ${itemRect.top - parentRect.top}px)`;
  if(skipTransition){
    void pill.offsetWidth;
    pill.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1), width .25s ease, height .25s ease';
  }
}

/* ================= RENDER: VIEW ROUTER ================= */
function renderView(){
  const main = document.getElementById('main');
  if(state.currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(state.currentView === 'offres') main.innerHTML = renderOffres();
  else if(state.currentView === 'omnibus') main.innerHTML = renderOmnibus();
  else if(state.currentView === 'reglages') main.innerHTML = renderReglages();
  main.classList.remove('view-fade'); void main.offsetWidth; main.classList.add('view-fade');
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const upcoming = state.offres.filter(o => offerStatus(o) !== 'passee').sort((a,b) => a.start.localeCompare(b.start));
  const active = state.offres.filter(o => offerStatus(o) === 'active');
  const nextOffer = upcoming.find(o => offerStatus(o) === 'avenir');
  const totalCells = state.omnibus.rows.length * state.omnibus.columns.length;
  let filled = 0;
  state.omnibus.rows.forEach(r => state.omnibus.columns.forEach(c => { if((r.cells[c.id]||'').trim()) filled++; }));
  const omnibusPct = totalCells ? Math.round((filled/totalCells)*100) : 0;

  const monthCounts = [];
  const base = new Date();
  for(let i=0;i<6;i++){
    const d = new Date(base.getFullYear(), base.getMonth()+i, 1);
    const count = state.offres.filter(o => {
      const s = parseDate(o.start);
      return s.getFullYear()===d.getFullYear() && s.getMonth()===d.getMonth();
    }).length;
    monthCounts.push({ label: MONTHS_FR[d.getMonth()].slice(0,3), count });
  }
  const maxCount = Math.max(1, ...monthCounts.map(m => m.count));

  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Mello Hub</div>
        <h1 class="page-title">Bonjour 👋</h1>
        <p class="page-sub">${new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</p>
      </div>
    </div>

    <div class="grid kpi-grid">
      ${kpiCard('Offres à venir', upcoming.filter(o=>offerStatus(o)==='avenir').length, ICONS.flash, 'var(--accent)', 'var(--accent-soft)')}
      ${kpiCard('Offres en cours', active.length, ICONS.check, 'var(--positive)', 'var(--positive-soft)')}
      ${kpiCard(nextOffer ? daysBetween(todayStr(), nextOffer.start)+' j' : '—', nextOffer ? 'avant « '+nextOffer.title+' »' : 'aucune offre à venir', ICONS.clock, 'var(--alert)', 'var(--alert-soft)', true)}
      ${kpiCard('Omnibus complété', omnibusPct+'%', ICONS.omnibus, 'var(--accent-2)', 'var(--accent-soft)')}
    </div>

    <div class="two-col">
      <div class="card">
        <div class="section-title">Prochaines offres <span class="count">${upcoming.length} au total</span></div>
        ${upcoming.length === 0 ? emptyState('Aucune offre planifiée pour le moment.') :
          upcoming.slice(0,5).map(o => {
            const st = offerStatus(o); const meta = STATUS_META[st];
            return `<div class="offer-mini">
              <span class="offer-dot" style="background:${o.color}"></span>
              <div>
                <div class="offer-mini-title">${escapeHtml(o.title)}</div>
                <div class="offer-mini-sub">${fmtDate(o.start)} → ${fmtDate(o.end)}</div>
              </div>
              <span class="offer-mini-badge" style="color:${meta.color};background:${meta.soft}">${meta.label}</span>
            </div>`;
          }).join('')}
      </div>

      <div class="card">
        <div class="section-title">Offres par mois</div>
        <div class="chart-wrap">
          <div class="bar-row">
            ${monthCounts.map(m => `
              <div class="bar-col">
                <div class="bar-shape" style="height:${Math.max(6,(m.count/maxCount)*100)}%"></div>
                <div class="bar-label">${m.label}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function kpiCard(value, label, icon, color, soft, reverse){
  return `<div class="card kpi-card">
    <div class="kpi-top">
      <div class="kpi-icon" style="background:${soft};color:${color}">${icon}</div>
    </div>
    <div class="kpi-value">${reverse ? value : value}</div>
    <div class="kpi-label">${label}</div>
  </div>`;
}

function emptyState(msg){
  return `<div class="empty-state">${ICONS.empty}<div>${escapeHtml(msg)}</div></div>`;
}

/* ================= OFFRES ================= */
function renderOffres(){
  const sorted = [...state.offres].sort((a,b) => a.start.localeCompare(b.start));
  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Commercial</div>
        <h1 class="page-title">Offres</h1>
        <p class="page-sub">Vue d'ensemble des opérations commerciales passées, actives et à venir.</p>
      </div>
      <div class="topbar-actions">
        <div class="segmented">
          <button class="${state.offresViewMode==='table'?'active':''}" data-action="offres-view" data-mode="table">${ICONS.table} Tableau</button>
          <button class="${state.offresViewMode==='calendar'?'active':''}" data-action="offres-view" data-mode="calendar">${ICONS.calendar} Calendrier</button>
        </div>
        <button class="btn btn-primary" data-action="open-offer-modal">${ICONS.plus} Nouvelle offre</button>
      </div>
    </div>
    ${state.offresViewMode === 'table' ? renderOffresTable(sorted) : renderOffresCalendar()}
  `;
}

function renderOffresTable(sorted){
  if(sorted.length === 0){
    return `<div class="card">${emptyState("Aucune offre pour le moment — cliquez sur « Nouvelle offre » pour commencer.")}</div>`;
  }
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Offre</th><th>Tag</th><th>Début</th><th>Fin</th><th>Statut</th><th></th>
        </tr></thead>
        <tbody>
          ${sorted.map(o => {
            const st = offerStatus(o); const meta = STATUS_META[st];
            return `<tr>
              <td><span class="offer-dot" style="background:${o.color};display:inline-block;margin-right:.5rem"></span><span class="cell-title">${escapeHtml(o.title)}</span></td>
              <td><span class="tag-chip">${escapeHtml(o.tag||'—')}</span></td>
              <td>${fmtDate(o.start)}</td>
              <td>${fmtDate(o.end)}</td>
              <td><span class="badge" style="color:${meta.color};background:${meta.soft}">${meta.label}</span></td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-action="edit-offer" data-id="${o.id}" title="Modifier">${ICONS.edit}</button>
                  <button class="icon-btn danger" data-action="delete-offer" data-id="${o.id}" title="Supprimer">${ICONS.trash}</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderOffresCalendar(){
  const { y, m } = state.calMonth;
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({ day: daysInPrevMonth - startOffset + i + 1, outside:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ day:d, outside:false, y, m });
  while(cells.length % 7 !== 0) cells.push({ day: cells.length, outside:true });

  const today = todayStr();
  function dateStrOf(cell){
    if(cell.outside) return null;
    const dd = String(cell.day).padStart(2,'0'); const mm = String(m+1).padStart(2,'0');
    return `${y}-${mm}-${dd}`;
  }
  const offersOnDay = (ds) => state.offres.filter(o => o.start <= ds && o.end >= ds);

  const selectedDay = state.calSelected;
  const selectedOffers = selectedDay ? offersOnDay(selectedDay) : [];

  return `
    <div class="card">
      <div class="cal-head">
        <h3>${MONTHS_FR[m]} ${y}</h3>
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev">${ICONS.chevronL}</button>
          <button class="btn btn-ghost" data-action="cal-today" style="padding:.4rem .75rem;font-size:.75rem;">Aujourd'hui</button>
          <button class="icon-btn" data-action="cal-next">${ICONS.chevronR}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW_FR.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(cell => {
          if(cell.outside) return `<div class="cal-day outside">${cell.day}</div>`;
          const ds = dateStrOf(cell);
          const dayOffers = offersOnDay(ds);
          const isToday = ds === today;
          const isSelected = ds === selectedDay;
          return `<div class="cal-day${isToday?' today':''}${isSelected?' selected':''}" data-action="cal-select" data-date="${ds}">
            ${cell.day}
            ${dayOffers.length ? `<div class="cal-day-dots">${dayOffers.slice(0,3).map(o => `<span style="background:${isSelected?'#fff':o.color}"></span>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      ${selectedDay ? `
        <div class="cal-day-list">
          <div class="section-title">${fmtDateLong(selectedDay)} <span class="count">${selectedOffers.length} offre${selectedOffers.length>1?'s':''}</span></div>
          ${selectedOffers.length === 0 ? emptyState('Aucune offre ce jour-là.') : selectedOffers.map(o => {
            const st = offerStatus(o); const meta = STATUS_META[st];
            return `<div class="offer-mini">
              <span class="offer-dot" style="background:${o.color}"></span>
              <div>
                <div class="offer-mini-title">${escapeHtml(o.title)}</div>
                <div class="offer-mini-sub">${fmtDate(o.start)} → ${fmtDate(o.end)}</div>
              </div>
              <span class="offer-mini-badge" style="color:${meta.color};background:${meta.soft}">${meta.label}</span>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

/* ---- Offer modal ---- */
const OFFER_COLORS = ['#1B4B8F','#1C9A6C','#DB9A2C','#D6455A','#5C7FB0','#7A5CB0'];

function openOfferModal(id){
  const editing = id ? state.offres.find(o => o.id === id) : null;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="offer-backdrop">
      <div class="modal">
        <h3 class="modal-title">${editing ? 'Modifier l’offre' : 'Nouvelle offre'}</h3>
        <div class="field">
          <label>Titre de l'offre</label>
          <input type="text" id="f-title" value="${editing ? escapeHtml(editing.title) : ''}" placeholder="Ex. Mello Days">
        </div>
        <div class="field">
          <label>Tag</label>
          <input type="text" id="f-tag" value="${editing ? escapeHtml(editing.tag||'') : ''}" placeholder="Ex. Temps fort, Soldes...">
        </div>
        <div class="field field-row">
          <div>
            <label>Début</label>
            <input type="date" id="f-start" value="${editing ? editing.start : todayStr()}">
          </div>
          <div>
            <label>Fin</label>
            <input type="date" id="f-end" value="${editing ? editing.end : todayStr()}">
          </div>
        </div>
        <div class="field">
          <label>Couleur</label>
          <div class="swatch-row" id="f-swatches">
            ${OFFER_COLORS.map(c => `<div class="swatch${(editing?editing.color:OFFER_COLORS[0])===c?' selected':''}" data-color="${c}" style="background:${c}"></div>`).join('')}
          </div>
        </div>
        <div class="modal-actions">
          ${editing ? `<button class="btn btn-ghost" style="margin-right:auto;color:var(--negative)" data-action="delete-offer" data-id="${editing.id}">Supprimer</button>` : ''}
          <button class="btn btn-ghost" data-action="close-modal">Annuler</button>
          <button class="btn btn-primary" data-action="save-offer" data-id="${editing ? editing.id : ''}">${ICONS.check} Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  requestAnimationFrame(() => document.getElementById('offer-backdrop').classList.add('open'));
  let selectedColor = editing ? editing.color : OFFER_COLORS[0];
  document.getElementById('f-swatches').addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch'); if(!sw) return;
    document.querySelectorAll('#f-swatches .swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected'); selectedColor = sw.dataset.color;
  });
  root.dataset.selectedColor = selectedColor;
  root._getColor = () => selectedColor;
}

function closeModal(){
  const backdrop = document.querySelector('.modal-backdrop');
  if(!backdrop) return;
  backdrop.classList.remove('open');
  setTimeout(() => { document.getElementById('modal-root').innerHTML=''; }, 200);
}

function saveOfferFromModal(id){
  const title = document.getElementById('f-title').value.trim();
  const tag = document.getElementById('f-tag').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const color = document.getElementById('modal-root')._getColor ? document.getElementById('modal-root')._getColor() : OFFER_COLORS[0];
  if(!title){ toast('Merci de renseigner un titre.', 'error'); return; }
  if(!start || !end || end < start){ toast('Les dates ne sont pas valides.', 'error'); return; }
  if(id){
    const o = state.offres.find(x => x.id === id);
    Object.assign(o, { title, tag, start, end, color });
    toast('Offre mise à jour.', 'success');
  }else{
    state.offres.push({ id: uid(), title, tag, start, end, color });
    toast('Offre créée.', 'success');
  }
  persistOffres();
  closeModal();
  renderView();
}

function deleteOffer(id){
  state.offres = state.offres.filter(o => o.id !== id);
  persistOffres();
  closeModal();
  renderView();
  toast('Offre supprimée.');
}

/* ================= OMNIBUS ================= */
function renderOmnibus(){
  const { columns, rows } = state.omnibus;
  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Conformité</div>
        <h1 class="page-title">Omnibus</h1>
        <p class="page-sub">Tableau comparatif des prix affichés — à compléter au fil des relevés.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" data-action="add-omni-row">${ICONS.plus} Critère</button>
        <button class="btn btn-primary" data-action="add-omni-col">${ICONS.plus} Produit</button>
      </div>
    </div>

    <div class="omni-note">
      ${ICONS.alertTri}
      <div>Ce tableau sert de base de suivi pour la directive européenne Omnibus. Ajoutez un produit par colonne et complétez chaque ligne au fur et à mesure de vos relevés — les données sont enregistrées automatiquement sur cet appareil.</div>
    </div>

    <div class="table-wrap">
      <table class="omni-table">
        <thead>
          <tr>
            <th class="omni-crit">Critère</th>
            ${columns.map(c => `
              <th>
                <div class="col-head-wrap">
                  <input class="cell-input" value="${escapeHtml(c.label)}" data-action="omni-col-label" data-col="${c.id}">
                  <button class="icon-btn danger" data-action="delete-omni-col" data-col="${c.id}" title="Supprimer la colonne">${ICONS.trash}</button>
                </div>
              </th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="omni-crit">
                <div class="col-head-wrap">
                  <input class="cell-input" value="${escapeHtml(r.label)}" data-action="omni-row-label" data-row="${r.id}">
                  <button class="icon-btn danger" data-action="delete-omni-row" data-row="${r.id}" title="Supprimer la ligne">${ICONS.trash}</button>
                </div>
              </td>
              ${columns.map(c => `
                <td><input class="cell-input" placeholder="—" value="${escapeHtml(r.cells[c.id]||'')}" data-action="omni-cell" data-row="${r.id}" data-col="${c.id}"></td>
              `).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function addOmniColumn(){
  const n = state.omnibus.columns.length + 1;
  state.omnibus.columns.push({ id: uid(), label: 'Produit ' + n });
  persistOmnibus(); renderView();
}
function addOmniRow(){
  state.omnibus.rows.push({ id: uid(), label: 'Nouveau critère', cells:{} });
  persistOmnibus(); renderView();
}
function deleteOmniColumn(colId){
  state.omnibus.columns = state.omnibus.columns.filter(c => c.id !== colId);
  state.omnibus.rows.forEach(r => delete r.cells[colId]);
  persistOmnibus(); renderView();
}
function deleteOmniRow(rowId){
  state.omnibus.rows = state.omnibus.rows.filter(r => r.id !== rowId);
  persistOmnibus(); renderView();
}

/* ================= RÉGLAGES ================= */

  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Application</div>
        <h1 class="page-title">Réglages</h1>
        <p class="page-sub">Informations générales et sécurité de l'outil.</p>
      </div>
    </div>

    <div class="two-col">
      <div class="card" style="margin-bottom:1rem;">
        <div class="section-title">Général</div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Version de l'application</div>
            <div class="settings-sub">Mello Hub</div>
          </div>
          <span class="version-pill">v${APP_VERSION}</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Apparence</div>
            <div class="settings-sub">Clair, sombre ou automatique</div>
          </div>
          ${renderThemeToggle()}
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Accès</div>
            <div class="settings-sub">Verrouiller l'application sur cet appareil</div>
          </div>
          <button class="btn btn-ghost" data-action="lock-app">${ICONS.lock} Verrouiller</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Historique des versions</div>
        ${CHANGELOG.map(c => `
          <div class="changelog-item">
            <span class="changelog-version">v${c.version}</span><span class="changelog-date">${c.date}</span>
            <div class="changelog-notes">${escapeHtml(c.notes)}</div>
          </div>`).join('')}

/* ================= EVENTS ================= */
function attachGlobalHandlers(){
  document.body.onclick = null; // avoid duplicate binding across re-shells
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('input', handleInput);
  window.addEventListener('resize', () => positionPill(true));
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el){
    if(e.target.id === 'offer-backdrop') closeModal();
    return;
  }
  const action = el.dataset.action;

  if(action === 'go-view'){
    state.currentView = el.dataset.view;
    saveJSON(STORAGE.view, state.currentView);
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    positionPill(false);
    renderView();
  }
  else if(action === 'set-theme'){
    saveJSON(STORAGE.theme, el.dataset.theme);
    applyTheme();
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }
  else if(action === 'open-offer-modal') openOfferModal(null);
  else if(action === 'edit-offer') openOfferModal(el.dataset.id);
  else if(action === 'delete-offer') deleteOffer(el.dataset.id);
  else if(action === 'save-offer') saveOfferFromModal(el.dataset.id || null);
  else if(action === 'close-modal') closeModal();
  else if(action === 'offres-view'){ state.offresViewMode = el.dataset.mode; renderView(); }
  else if(action === 'cal-prev'){ shiftMonth(-1); }
  else if(action === 'cal-next'){ shiftMonth(1); }
  else if(action === 'cal-today'){ const n = new Date(); state.calMonth = { y:n.getFullYear(), m:n.getMonth() }; state.calSelected = todayStr(); renderView(); }
  else if(action === 'cal-select'){ state.calSelected = state.calSelected === el.dataset.date ? null : el.dataset.date; renderView(); }
  else if(action === 'add-omni-col') addOmniColumn();
  else if(action === 'add-omni-row') addOmniRow();
  else if(action === 'delete-omni-col') deleteOmniColumn(el.dataset.col);
  else if(action === 'delete-omni-row') deleteOmniRow(el.dataset.row);
  else if(action === 'lock-app') lockApp();
}

function handleInput(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'omni-cell'){
    const { row, col } = el.dataset;
    const r = state.omnibus.rows.find(x => x.id === row);
    if(r){ r.cells[col] = el.value; persistOmnibus(); }
  }
  else if(action === 'omni-col-label'){
    const c = state.omnibus.columns.find(x => x.id === el.dataset.col);
    if(c){ c.label = el.value; persistOmnibus(); }
  }
  else if(action === 'omni-row-label'){
    const r = state.omnibus.rows.find(x => x.id === el.dataset.row);
    if(r){ r.label = el.value; persistOmnibus(); }
  }
}

function shiftMonth(delta){
  let { y, m } = state.calMonth;
  m += delta;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  state.calMonth = { y, m };
  renderView();
}

/* ================= INIT ================= */
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(loadJSON(STORAGE.theme, 'auto') === 'auto') applyTheme();
});
if(isUnlocked()) renderShell(); else renderLock();
</script>
