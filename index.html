<!DOCTYPE html>
<html lang="fr">
<head>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('mellohub_theme') || 'auto';
      var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mello Hub">
<meta name="theme-color" content="#0B1A30">
<title>Mello Hub</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F6F6F7;
    --card:#FFFFFF;
    --card-glass:rgba(255,255,255,0.66);
    --ink:#18191C;
    --muted:#6B7078;
    --border:rgba(20,20,23,0.08);
    --accent:#1B4B8F;
    --accent-2:#5C7FB0;
    --accent-soft:rgba(27,75,143,0.10);
    --positive:#1C9A6C;
    --positive-soft:rgba(28,154,108,0.12);
    --negative:#D6455A;
    --negative-soft:rgba(214,69,90,0.12);
    --alert:#DB9A2C;
    --alert-soft:rgba(219,154,44,0.14);
    --violet:#7A5CB0;
    --violet-soft:rgba(122,92,176,0.12);
    --radius:20px;
    --radius-sm:13px;
    --shadow-soft: 0 10px 30px rgba(14,27,44,0.08);
    /* Cartes KPI — mêmes teintes que le reste de la palette (accent / positif / alerte / violet), simplement plus présentes */
    --kpi-1-bg:#E3ECFA;
    --kpi-1-bg2:#CBDCF6;
    --kpi-2-bg:#DFF3E9;
    --kpi-2-bg2:#C7ECDA;
    --kpi-3-bg:#FBEEDA;
    --kpi-3-bg2:#F6DFB8;
    --kpi-4-bg:#EFE7F8;
    --kpi-4-bg2:#E1D2F2;
  }
  [data-theme="dark"]{
    --bg:#080F1C;
    --surface:#0D1930;
    --card:#111F35;
    --card-glass:rgba(17,31,53,0.62);
    --ink:#EAF0FA;
    --muted:#8FA3BE;
    --border:rgba(255,255,255,0.08);
    --accent:#6C9BE0;
    --accent-2:#8FA8C9;
    --accent-soft:rgba(108,155,224,0.14);
    --positive:#3FC08C;
    --positive-soft:rgba(63,192,140,0.14);
    --negative:#F2717F;
    --negative-soft:rgba(242,113,127,0.14);
    --alert:#F0B84C;
    --alert-soft:rgba(240,184,76,0.16);
    --violet:#A98BDA;
    --violet-soft:rgba(169,139,218,0.16);
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
    --kpi-1-bg:rgba(108,155,224,0.16);
    --kpi-1-bg2:rgba(108,155,224,0.30);
    --kpi-2-bg:rgba(63,192,140,0.14);
    --kpi-2-bg2:rgba(63,192,140,0.26);
    --kpi-3-bg:rgba(240,184,76,0.16);
    --kpi-3-bg2:rgba(240,184,76,0.28);
    --kpi-4-bg:rgba(169,139,218,0.16);
    --kpi-4-bg2:rgba(169,139,218,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.005em;
    transition:background .3s ease, color .3s ease;
  }
  h1,h2,h3,h4{font-weight:600;margin:0;letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  html,body{width:100%;background:var(--bg);}
  #app.shell{display:flex;min-height:100dvh;}

  /* ---------- Sidebar / Nav (shared markup, two layouts) ---------- */
  .sidebar{
    width:236px;flex-shrink:0;position:sticky;top:0;height:100dvh;
    padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.75rem;
    border-right:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:.65rem;padding:0 .35rem;}
  .brand-badge{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block;object-fit:cover;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 10px rgba(8,26,52,0.35);
  }
  .brand-name{font-weight:600;font-size:1rem;line-height:1.1;}
  .brand-sub{font-size:.68rem;color:var(--muted);font-weight:500;}

  .nav-shell{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;}
  .nav{position:relative;display:flex;flex-direction:column;gap:.15rem;padding:.35rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .nav-secondary{margin-top:auto;display:flex;flex-direction:column;padding:.35rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .nav-pill{
    position:absolute;top:0;left:0;border-radius:9px;z-index:0;
    background: var(--ink);
    opacity:0.92;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .nav-item{
    position:relative;z-index:1;display:flex;align-items:center;gap:.7rem;
    padding:.62rem .75rem;border-radius:9px;cursor:pointer;color:var(--muted);
    font-size:.86rem;font-weight:500;transition:color .2s ease;user-select:none;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item.active{color:var(--bg);}
  .nav-item:not(.active):hover{color:var(--ink);}
  .nav-secondary .nav-item{z-index:auto;}
  .nav-secondary .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-secondary .nav-item:not(.active):hover{background:var(--accent-soft);}
  .nav-label-full{display:inline;}
  .nav-label-compact{display:none;}

  .sidebar-foot{display:flex;flex-direction:column;gap:.6rem;}
  .foot-note{font-size:.66rem;color:var(--muted);padding:0 .35rem;line-height:1.4;}

  /* ---------- Main content ---------- */
  .main{flex:1;min-width:0;max-width:1360px;padding:calc(1.75rem + env(safe-area-inset-top, 0px)) 2.25rem calc(3rem + env(safe-area-inset-bottom,0px));}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap;}
  .eyebrow{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;}
  .page-title{font-size:1.7rem;}
  .page-sub{color:var(--muted);font-size:.88rem;margin-top:.35rem;}
  .topbar-actions{display:flex;gap:.6rem;align-items:center;}

  .btn{
    border:none;border-radius:999px;padding:.65rem 1.15rem;font-weight:500;font-size:.85rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:.45rem;transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(27,75,143,0.28);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-danger-text{background:transparent;color:var(--negative);padding:.4rem .5rem;}
  .btn svg{width:15px;height:15px;}

  .segmented{display:inline-flex;gap:.5rem;background:transparent;border:none;padding:0;}
  .segmented button{
    border:1.5px solid var(--border);background:var(--surface);padding:.55rem 1rem;border-radius:12px;
    font-size:.8rem;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .segmented button svg{width:15px;height:15px;flex-shrink:0;}
  .segmented button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:1rem;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);margin-bottom:1.4rem;}
  .card{
    background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);
    padding:1.15rem 1.3rem;box-shadow:var(--shadow-soft);
  }
  .kpi-card{
    display:flex;flex-direction:column;justify-content:space-between;gap:1.4rem;
    border-radius:22px;padding:1.25rem 1.35rem;min-height:148px;border:none;box-shadow:none;color:var(--ink);
  }
  .kpi-1{background:linear-gradient(135deg, var(--kpi-1-bg), var(--kpi-1-bg2));}
  .kpi-2{background:linear-gradient(135deg, var(--kpi-2-bg), var(--kpi-2-bg2));}
  .kpi-3{background:linear-gradient(135deg, var(--kpi-3-bg), var(--kpi-3-bg2));}
  .kpi-4{background:linear-gradient(135deg, var(--kpi-4-bg), var(--kpi-4-bg2));}
  .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
  .kpi-card-label{font-size:.83rem;font-weight:500;color:var(--muted);}
  .kpi-arrow{
    width:32px;height:32px;border-radius:50%;border:1.5px solid color-mix(in srgb, var(--ink) 18%, transparent);background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;
  }
  .kpi-arrow svg{width:14px;height:14px;}
  .kpi-value-row{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;}
  .kpi-value{font-size:1.7rem;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
  .kpi-value-sub{font-size:.78rem;font-weight:500;color:var(--muted);}

  .section-title{font-size:1rem;font-weight:600;margin:0 0 .85rem;display:flex;align-items:center;justify-content:space-between;}
  .section-title span.count{color:var(--muted);font-weight:500;font-size:.8rem;}

  .two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;align-items:start;}

  /* Upcoming offer list — pill rows */
  .offer-mini{
    display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem;border-radius:16px;
    border:1px solid var(--border);background:var(--surface);transition:border-color .15s ease, background .15s ease;
  }
  .offer-mini + .offer-mini{margin-top:.55rem;}
  .offer-mini:hover{border-color:var(--accent);background:var(--accent-soft);}
  .offer-dot{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,0.4);
  }
  .offer-mini-title{font-weight:500;font-size:.86rem;}
  .offer-mini-sub{font-size:.74rem;color:var(--muted);margin-top:.1rem;}
  .offer-mini-badge{margin-left:auto;font-size:.7rem;font-weight:600;padding:.28rem .6rem;border-radius:20px;white-space:nowrap;}
  .empty-state{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.85rem;}
  .empty-state svg{width:32px;height:32px;margin-bottom:.6rem;opacity:.5;}

  /* Bar chart */
  .chart-wrap{position:relative;}
  .bar-row{display:flex;align-items:flex-end;gap:.65rem;height:120px;padding-top:.5rem;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.4rem;height:100%;justify-content:flex-end;}
  .bar-shape{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent-2),var(--accent));min-height:4px;}
  .bar-label{font-size:.66rem;color:var(--muted);font-weight:600;}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-soft);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  thead th{
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    font-weight:600;padding:.85rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:.8rem 1rem;font-size:.86rem;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  .cell-title{font-weight:500;}
  .cell-sub{color:var(--muted);font-size:.72rem;margin-top:.15rem;}
  .badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.3rem .65rem;border-radius:20px;}
  .row-actions{display:flex;gap:.3rem;justify-content:flex-end;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn.danger:hover{background:var(--negative-soft);color:var(--negative);}
  .icon-btn svg{width:15px;height:15px;}
  .tag-chip{font-size:.7rem;font-weight:600;padding:.22rem .55rem;border-radius:8px;background:var(--accent-soft);color:var(--accent);}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .cal-nav{display:flex;gap:.4rem;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;}
  .cal-dow{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding-bottom:.4rem;}
  .cal-day{
    aspect-ratio:1/0.64;border-radius:11px;border:1.5px solid transparent;padding:.42rem;position:relative;
    font-size:.78rem;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  [data-theme="dark"] .cal-day{background:rgba(255,255,255,0.03);}
  .cal-day.outside{opacity:.3;cursor:default;}
  .cal-day:hover:not(.outside){transform:translateY(-1px);}
  .cal-day-num{position:relative;z-index:1;}
  .cal-day.filled{color:var(--ink);font-weight:600;}
  .cal-day.today{border-color:var(--accent);}
  .cal-day.filled.today{border-color:transparent;box-shadow:inset 0 0 0 2px rgba(20,20,23,0.28);}
  .cal-day.selected{box-shadow:0 0 0 2px var(--ink);}
  .cal-day-more{position:absolute;bottom:4px;right:6px;font-size:.6rem;font-weight:700;opacity:.75;z-index:1;}
  .cal-day-offericon{
    position:absolute;top:4px;left:4px;width:15px;height:15px;border-radius:50%;
    background:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;color:#171717;z-index:1;
  }
  .cal-day-offericon svg{width:9px;height:9px;}
  .cal-day-marker{
    position:absolute;top:4px;right:4px;width:15px;height:15px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;z-index:1;
  }
  .cal-day-marker svg{width:9px;height:9px;}
  .cal-day-list{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--border);}
  .day-markers-section{margin-top:1rem;padding-top:.85rem;border-top:1px dashed var(--border);}
  .day-markers-head{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;margin-bottom:.5rem;}
  .marker-chip{display:flex;align-items:center;gap:.6rem;padding:.4rem .2rem;font-size:.82rem;}
  .marker-chip span:nth-child(2){flex:1;}
  .marker-chip-icon{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .marker-chip-icon svg{width:13px;height:13px;}
  .marker-type-row{display:flex;gap:.5rem;}
  .marker-type-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;padding:.7rem .5rem;min-height:74px;
    border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;
    font-family:inherit;font-size:.72rem;font-weight:500;transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .marker-type-btn svg{width:17px;height:17px;}
  .marker-type-btn.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  /* Résumé des durées */
  .duration-row{display:flex;align-items:center;gap:.65rem;padding:.65rem 0;border-bottom:1px solid var(--border);}
  .duration-row:last-child{border-bottom:none;}
  .duration-title{font-weight:500;font-size:.85rem;flex:1;}
  .duration-value{font-size:.78rem;color:var(--muted);}

  /* Sous-offres (dans la modale + affichage) */
  .suboffer-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;}
  .suboffer-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.4rem .6rem;font-size:.82rem;}
  .suboffer-add-row{display:flex;gap:.5rem;}
  .suboffer-add-row input{flex:1;padding:.55rem .7rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:.85rem;}
  .suboffer-add-row input:focus{outline:none;border-color:var(--accent);}
  .sub-offer-chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}

  /* ---------- Omnibus — suivi produits / variantes ---------- */
  .add-col-btn{
    display:flex;align-items:center;justify-content:center;gap:.4rem;min-width:120px;border:1.5px dashed var(--border);
    border-radius:10px;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:.7rem;background:transparent;
  }
  .add-col-btn svg{width:14px;height:14px;flex-shrink:0;}
  .add-col-btn:hover{border-color:var(--accent);color:var(--accent);}
  .product-name-input{
    border:none;background:transparent;font-family:inherit;font-weight:600;font-size:1rem;color:var(--ink);
    padding:.2rem .3rem;border-radius:7px;max-width:70%;
  }
  .product-name-input:hover{background:var(--surface);}
  .product-name-input:focus{outline:none;background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft);}
  .variant-row{border:1px solid var(--border);border-radius:14px;padding:.85rem 1rem;background:var(--surface);}
  .variant-row + .variant-row{margin-top:.6rem;}
  .variant-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;}
  .variant-name-input{
    border:none;background:transparent;font-family:inherit;font-weight:600;font-size:.88rem;color:var(--ink);
    padding:.2rem .35rem;border-radius:6px;max-width:200px;
  }
  .variant-name-input:hover{background:var(--card);}
  .variant-name-input:focus{outline:none;background:var(--card);box-shadow:0 0 0 2px var(--accent-soft);}
  .variant-badges{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
  .variant-warning{color:var(--alert);display:flex;cursor:help;}
  .variant-warning svg{width:16px;height:16px;}
  .variant-bottom{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:.65rem;}
  .variant-since{font-size:.78rem;color:var(--muted);}
  .variant-since strong{color:var(--ink);font-weight:600;}
  .variant-actions{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
  .btn-sm{padding:.4rem .75rem;font-size:.76rem;}
  .variant-history{margin-top:.65rem;padding-top:.6rem;border-top:1px dashed var(--border);}
  .variant-history-item{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.76rem;color:var(--muted);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,12,24,0.45);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--card);border-radius:18px;width:100%;max-width:440px;padding:1.5rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);transform:translateY(12px) scale(.98);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);
    max-height:88vh;overflow-y:auto;
  }
  .modal-backdrop.open .modal{transform:translateY(0) scale(1);opacity:1;}
  .modal-title{font-size:1.05rem;margin-bottom:1.1rem;}
  .field{margin-bottom:.9rem;}
  .field label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;padding:.65rem .75rem;border-radius:10px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:.85rem;
  }
  .field textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}

  /* toast */
  .toast-wrap{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.5rem;align-items:center;}

  /* ---------- Lock screen ---------- */

  .lock-badge{width:56px;height:56px;border-radius:15px;margin:0 auto 1.1rem;display:block;object-fit:cover;

  .lock-field{position:relative;margin-bottom:.9rem;}
  .lock-field input{
    width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid rgba(255,255,255,0.16);

  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

  /* ---------- Réglages ---------- */
  .settings-stack{display:flex;flex-direction:column;gap:1rem;max-width:640px;}

  .version-pill-btn{

  }
  .version-pill-btn:hover{background:var(--surface);color:var(--ink);}
  .version-pill-btn svg{width:11px;height:11px;transition:transform .2s ease;opacity:.7;}
  .theme-toggle{display:flex;gap:.5rem;background:transparent;border:none;padding:0;}
  .theme-btn{
    flex:1;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:.7rem .5rem;min-height:74px;
    cursor:pointer;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .theme-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .theme-btn svg{width:17px;height:17px;}
  .theme-btn-label{font-size:.68rem;font-weight:500;white-space:nowrap;}
  .changelog-list{margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--border);animation:viewFade .25s ease both;}
  .changelog-item{padding:.75rem 0;border-bottom:1px solid var(--border);}

  /* =========================================================
     Responsive — 4 paliers cohérents
     Desktop (>1100px) · Tablette (761–1100px) · Mobile (≤760px) · Petit mobile (≤420px)
     ========================================================= */

  /* ---- Tablette : la nav latérale reste, mais l'espace se resserre ---- */
  @media (max-width:1100px){

  @media (max-width:420px){

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-wrap" class="toast-wrap"></div>

<script>
/* =========================================================
   MELLO HUB — dashboard interne Mello Matelas
   Architecture: fichier unique, vanilla JS, localStorage,
   PWA installable — voir "Fiche technique Cockpit"
   ========================================================= */

/* ---------------- Storage helpers ---------------- */
function loadJSON(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ toast("Impossible d'enregistrer les données.", "error"); return false; }
}
function uid(){ return Math.random().toString(36).slice(2,10); }

const STORAGE = {
  offres: 'mellohub_offres',
  omnibus: 'mellohub_omnibus_products',
  dayMarkers: 'mellohub_daymarkers',
  theme: 'mellohub_theme',
  view: 'mellohub_lastview',
  unlocked: 'mellohub_unlocked'
};

/* ---------------- Version & changelog ---------------- */
const APP_VERSION = '1.2.1';
const CHANGELOG = [
  { version:'1.2.1', date:'Août 2026', notes:"Uniformisation de tous les sélecteurs (Offres, Apparence, type de repère), fonds en blanc pur, calendrier plus compact et aux couleurs adoucies, icônes sur les offres, repères multi-jours colorés et personnalisables, numéro de version discret, page d'accueil épurée." },
  { version:'1.2.0', date:'Août 2026', notes:"Refonte du calendrier Offres (pleine largeur, jours en couleur pleine, résumé des durées, notes et sous-offres, repères de journée), suivi Omnibus repensé par produit/variante avec historique des promotions, sélecteur de menu plus sobre, icônes et libellés clarifiés dans Réglages." },
  { version:'1.1.0', date:'Août 2026', notes:"Design plus sobre et épuré, vue Calendrier par défaut dans Offres avec un affichage plus compact, page d'accueil simplifiée, réglages ancrés en bas de la barre latérale." },
  { version:'1.0.1', date:'Août 2026', notes:"Ajout de l'écran de verrouillage commun et de la page Réglages." },
  { version:'1.0.0', date:'Août 2026', notes:'Première version : Tableau de bord, Offres et Omnibus.' }
];

/* ---------------- Système de mise à jour ----------------
   Compare la version locale à celle du index.html publié sur l'hébergement.
   Fonctionne uniquement lorsque l'app est servie via http(s) (GitHub Pages, etc.) —
   ouverte en fichier local (file://), la vérification n'est pas possible. */
function compareVersions(a, b){
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const diff = (pa[i]||0) - (pb[i]||0);
    if(diff !== 0) return diff > 0 ? 1 : -1;
  }
  return 0;
}

async function checkForUpdate(manual){
  state.updateCheck = { status:'checking', version:null, checkedAt:null };
  if(manual) renderView();
  try{
    const res = await fetch('./index.html?_=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('http-' + res.status);
    const html = await res.text();
    const match = html.match(/APP_VERSION\s*=\s*['"]([\d.]+)['"]/);
    if(!match) throw new Error('version-not-found');
    const remoteVersion = match[1];
    const cmp = compareVersions(remoteVersion, APP_VERSION);
    state.updateCheck = { status: cmp > 0 ? 'available' : 'uptodate', version: remoteVersion, checkedAt: new Date() };
    if(cmp > 0 && !manual) toast(`Nouvelle version disponible : v${remoteVersion} (voir Réglages)`, 'success');
  }catch(e){
    // Échec silencieux (app ouverte en local, hors-ligne...) — on revient simplement à l'état neutre.
    state.updateCheck = { status:'idle', version:null, checkedAt:null };
  }
  if(state.currentView === 'reglages') renderView();
}

function applyUpdate(){
  toast('Mise à jour en cours…', 'success');
  setTimeout(() => { window.location.href = window.location.pathname + '?_=' + Date.now(); }, 400);
}

function updateStatusText(){
  const uc = state.updateCheck;
  if(uc.status === 'checking') return 'Recherche en cours…';
  if(uc.status === 'available') return `Nouvelle version disponible : v${uc.version}`;
  if(uc.status === 'uptodate') return `Vous utilisez déjà la dernière version.`;
  return `Dernière vérification non effectuée.`;
}

/* ---------------- Accès protégé par mot de passe ----------------
   Le mot de passe n'est jamais stocké en clair : seule son empreinte
   SHA-256 est comparée à celle saisie par l'utilisateur. */
const ACCESS_HASH = '91dcdf174d85b852069eff7890f683e400651df14f54b892b71a6f7a70e524f0';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function isUnlocked(){ return sessionStorage.getItem(STORAGE.unlocked) === 'true' || localStorage.getItem(STORAGE.unlocked) === 'true'; }

/* ---------------- Seed data ---------------- */
function seedOffres(){
  const today = new Date();
  const d = (offset) => { const x = new Date(today); x.setDate(x.getDate()+offset); return x.toISOString().slice(0,10); };
  return [
    { id: uid(), title:"Soldes d'été", tag:"Soldes", start:d(-5), end:d(9), color:"#1B4B8F", note:"", subOffers:[{id:uid(), title:'Matelas -30%'}, {id:uid(), title:'Oreillers -20%'}] },
    { id: uid(), title:"Mello Days", tag:"Temps fort", start:d(14), end:d(21), color:"#DB9A2C", note:"", subOffers:[] },
    { id: uid(), title:"Au Lit Days", tag:"Temps fort", start:d(35), end:d(40), color:"#1C9A6C", note:"", subOffers:[] },
    { id: uid(), title:"Avant-première Black Friday", tag:"Avant-première", start:d(60), end:d(63), color:"#D6455A", note:"", subOffers:[] }
  ];
}
/* Migration silencieuse : les anciens repères (v1.2.0) avaient un champ `date`
   unique ; on le convertit en startDate/endDate + couleur par défaut, sans perte. */
function migrateDayMarkers(markers){
  return markers.map(mk => ({
    id: mk.id,
    startDate: mk.startDate || mk.date,
    endDate: mk.endDate || mk.date || mk.startDate,
    icon: mk.icon || 'custom',
    label: mk.label || '',
    color: mk.color || '#5C7FB0'
  }));
}
function seedDayMarkers(){
  const today = new Date();
  const d = (offset) => { const x = new Date(today); x.setDate(x.getDate()+offset); return x.toISOString().slice(0,10); };
  return [
    { id: uid(), startDate: d(2), endDate: d(2), icon:'newsletter', label:'Envoi newsletter', color:'#1B4B8F' },
    { id: uid(), startDate: d(6), endDate: d(9), icon:'countdown', label:'Décompte fin des soldes', color:'#D6455A' }
  ];
}
/* Suivi Omnibus — un produit a plusieurs variantes ; chaque variante garde un
   historique de ses changements de statut (normal / promo) pour connaître
   depuis quand elle est dans son état actuel, et détecter les périodes de
   prix normal trop courtes (<30 jours) avant une promotion. */
function seedOmnibusProducts(){
  const today = new Date();
  const daysAgo = (n) => { const x = new Date(today); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };
  function variant(name, seedDays){
    return { id: uid(), name, currentStatus:'normal', statusSince: daysAgo(seedDays), history:[{date:daysAgo(seedDays), status:'normal'}] };
  }
  function product(name){
    return { id: uid(), name, variants:[ variant('Classique', 52), variant('Pure+', 52) ] };
  }
  return [ product('Matelas Relax'), product('Matelas Hybride'), product('Matelas Max') ];
}

let state = {
  offres: loadJSON(STORAGE.offres, null) || seedOffres(),
  omnibusProducts: loadJSON(STORAGE.omnibus, null) || seedOmnibusProducts(),
  dayMarkers: migrateDayMarkers(loadJSON(STORAGE.dayMarkers, null) || seedDayMarkers()),
  currentView: loadJSON(STORAGE.view, 'dashboard'),
  calMonth: (() => { const n = new Date(); return { y:n.getFullYear(), m:n.getMonth() }; })(),
  calSelected: null,
  offresViewMode: 'calendar',
  updateCheck: { status:'idle', version:null, checkedAt:null },
  showChangelog: false,
  omniExpanded: {}
};
if(!loadJSON(STORAGE.offres, null)) saveJSON(STORAGE.offres, state.offres);
if(!loadJSON(STORAGE.omnibus, null)) saveJSON(STORAGE.omnibus, state.omnibusProducts);
if(!loadJSON(STORAGE.dayMarkers, null)) saveJSON(STORAGE.dayMarkers, state.dayMarkers);

function persistOffres(){ saveJSON(STORAGE.offres, state.offres); }
function persistOmnibus(){ saveJSON(STORAGE.omnibus, state.omnibusProducts); }
function persistDayMarkers(){ saveJSON(STORAGE.dayMarkers, state.dayMarkers); }

/* ---------------- Icons (inline SVG, stroke-based) ---------------- */
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  offres: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/><path d="M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg>',
  omnibus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 6h6v6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2.2"/><path d="M8.5 20h7M12 16v4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  chevronL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevronR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',

/* ---------------- Utils ---------------- */
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()].slice(0,3); }
function fmtDateLong(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()] + ' ' + d.getFullYear(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function offerStatus(o){
  const t = todayStr();
  if(o.end < t) return 'passee';
  if(o.start <= t && o.end >= t) return 'active';
  return 'avenir';
}
const STATUS_META = {
  avenir: { label:'À venir', color:'var(--accent)', soft:'var(--accent-soft)' },
  active: { label:'En cours', color:'var(--positive)', soft:'var(--positive-soft)' },
  passee: { label:'Terminée', color:'var(--muted)', soft:'rgba(91,107,130,0.12)' }
};
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ---------------- Toasts ---------------- */
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = (kind==='success'?ICONS.check:kind==='error'?ICONS.alertTri:'') + '<span>' + escapeHtml(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(8px)'; el.style.transition='all .25s ease'; setTimeout(()=>el.remove(), 250); }, 2200);
}

/* ================= LOCK SCREEN ================= */
function renderLock(){
  const app = document.getElementById('app');
  app.classList.remove('shell');
  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-arc a1"></div><div class="lock-arc a2"></div><div class="lock-arc a3"></div>
      <div class="lock-card">
        <img class="lock-badge" src="./icon-192.png" alt="Mello Hub">
        <div class="lock-title">Mello Hub</div>
        <div class="lock-sub">Accès réservé à l'équipe Mello</div>
        <div class="lock-field">
          <input type="password" id="lock-input" placeholder="Mot de passe" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="lock-error" id="lock-error"></div>
        <label style="display:flex;align-items:center;gap:.45rem;justify-content:center;margin-bottom:1rem;font-size:.75rem;color:rgba(255,255,255,0.55);">
          <input type="checkbox" id="lock-remember" checked style="accent-color:#6C9BE0;">
          Rester connecté sur cet appareil
        </label>
        <button class="lock-btn" id="lock-submit">${ICONS.unlock} Déverrouiller</button>
      </div>
    </div>
  `;
  const input = document.getElementById('lock-input');
  const errorEl = document.getElementById('lock-error');
  const card = document.querySelector('.lock-card');
  input.focus();

  async function attempt(){
    const value = input.value;
    if(!value) return;
    const hash = await sha256Hex(value);
    if(hash === ACCESS_HASH){
      const remember = document.getElementById('lock-remember').checked;
      if(remember) localStorage.setItem(STORAGE.unlocked, 'true');
      else sessionStorage.setItem(STORAGE.unlocked, 'true');
      renderShell();
    }else{
      errorEl.textContent = 'Mot de passe incorrect.';
      card.classList.remove('lock-shake'); void card.offsetWidth; card.classList.add('lock-shake');
      input.value=''; input.focus();
    }
  }
  document.getElementById('lock-submit').addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') attempt(); });
}

function lockApp(){
  localStorage.removeItem(STORAGE.unlocked);
  sessionStorage.removeItem(STORAGE.unlocked);
  renderLock();
}

function applyTheme(){
  const saved = loadJSON(STORAGE.theme, 'auto');
  const isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
}

function positionPill(skipTransition){
  const pill = document.getElementById('nav-pill');
  const nav = document.getElementById('nav');
  const active = nav.querySelector('.nav-item.active');
  if(!pill || !nav) return;
  if(!active){ pill.style.opacity = '0'; return; }
  pill.style.opacity = '1';
  if(skipTransition) pill.style.transition = 'none';
  const itemRect = active.getBoundingClientRect();
  const parentRect = nav.getBoundingClientRect();
  pill.style.width = itemRect.width + 'px';
  pill.style.height = itemRect.height + 'px';
  pill.style.transform = `translate(${itemRect.left - parentRect.left}px, ${itemRect.top - parentRect.top}px)`;
  if(skipTransition){
    void pill.offsetWidth;
    pill.style.transition = 'transform .25s cubic-bezier(.4,0,.2,1), width .2s ease, height .2s ease';
  }
}

function renderOffresCalendar(){
  const { y, m } = state.calMonth;
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({ day: daysInPrevMonth - startOffset + i + 1, outside:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ day:d, outside:false });
  while(cells.length % 7 !== 0) cells.push({ day: cells.length, outside:true });

  const today = todayStr();
  function dateStrOf(cell){
    if(cell.outside) return null;
    const dd = String(cell.day).padStart(2,'0'); const mm = String(m+1).padStart(2,'0');
    return `${y}-${mm}-${dd}`;
  }
  const offersOnDay = (ds) => state.offres.filter(o => o.start <= ds && o.end >= ds);
  const markersOnDay = (ds) => state.dayMarkers.filter(mk => mk.startDate <= ds && (mk.endDate || mk.startDate) >= ds);

  const selectedDay = state.calSelected;
  const selectedOffers = selectedDay ? offersOnDay(selectedDay) : [];
  const selectedMarkers = selectedDay ? markersOnDay(selectedDay) : [];

  return `
    <div class="card cal-card">
      <div class="cal-head">
        <h3>${MONTHS_FR[m]} ${y}</h3>
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev">${ICONS.chevronL}</button>
          <button class="btn btn-ghost" data-action="cal-today" style="padding:.4rem .75rem;font-size:.75rem;">Aujourd'hui</button>
          <button class="icon-btn" data-action="cal-next">${ICONS.chevronR}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW_FR.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(cell => {
          if(cell.outside) return `<div class="cal-day outside"><span class="cal-day-num">${cell.day}</span></div>`;
          const ds = dateStrOf(cell);
          const dayOffers = offersOnDay(ds);
          const dayMarkers = markersOnDay(ds);
          const isToday = ds === today;
          const isSelected = ds === selectedDay;
          let fillStyle = '';
          let filledClass = '';
          if(dayOffers.length === 1){
            fillStyle = `background:${softenColor(dayOffers[0].color)};`;
            filledClass = ' filled';
          } else if(dayOffers.length > 1){
            fillStyle = `background:linear-gradient(135deg, ${softenColor(dayOffers[0].color)} 50%, ${softenColor(dayOffers[1].color)} 50%);`;
            filledClass = ' filled';
          }
          const offerIcon = dayOffers.length ? offerIconOf(dayOffers[0]) : null;
          const marker = dayMarkers.length ? dayMarkers[0] : null;
          const markerType = marker ? (MARKER_TYPES.find(t => t.id === marker.icon) || MARKER_TYPES[2]) : null;
          return `<div class="cal-day${filledClass}${isToday?' today':''}${isSelected?' selected':''}" style="${fillStyle}" data-action="cal-select" data-date="${ds}">
            <span class="cal-day-num">${cell.day}</span>
            ${dayOffers.length > 2 ? `<span class="cal-day-more">+${dayOffers.length-2}</span>` : ''}
            ${offerIcon ? `<span class="cal-day-offericon">${offerIcon.icon}</span>` : ''}
            ${marker ? `<span class="cal-day-marker" style="background:${softenColor(marker.color || '#5C7FB0', 0.6)};color:${marker.color || 'var(--accent)'}">${markerType.icon}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
      ${selectedDay ? renderDayDetail(selectedDay, selectedOffers, selectedMarkers) : ''}
    </div>
  `;
}

/* Adoucit une couleur hex en la mélangeant avec du blanc — utilisé pour les
   remplissages de jour du calendrier, afin de garder les teintes vives comme
   identifiants (puces, pastilles) mais des fonds de case beaucoup plus doux. */
function softenColor(hex, amount = 0.72){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  const mix = (c) => Math.round(c + (255 - c) * amount);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

function renderOmnibus(){

  const promoCount = allVariants.filter(v => v.currentStatus === 'promo').length;

  const warnCount = allVariants.filter(v => variantComplianceWarning(v) !== null).length;

  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Conformité</div>
        <h1 class="page-title">Omnibus</h1>
        <p class="page-sub">Suivi du statut prix par produit et variante — durée depuis le dernier changement, historique, alertes de conformité.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" data-action="add-product">${ICONS.plus} Produit</button>
      </div>
    </div>

    <div class="grid kpi-grid" style="margin-bottom:1.4rem;">
      ${kpiCard('kpi-1', 'Variantes suivies', totalVariants, `${state.omnibusProducts.length} produit${state.omnibusProducts.length>1?'s':''}`)}
      ${kpiCard('kpi-2', 'Prix normal actuellement', normalCount, null)}
      ${kpiCard('kpi-3', 'En promotion', promoCount, null)}
      ${kpiCard('kpi-4', 'Alertes conformité', warnCount, warnCount>0 ? 'Prix normal < 30 jours' : 'Aucune alerte')}
    </div>

    ${state.omnibusProducts.length === 0
      ? `<div class="card">${emptyState("Aucun produit suivi pour le moment — cliquez sur « Produit » pour commencer.")}</div>`
      : state.omnibusProducts.map(p => renderOmniProductCard(p)).join('')}
  `;
}

function renderOmniProductCard(p){
  return `
    <div class="card" style="margin-bottom:1rem;">
      <div class="section-title">
        <input class="product-name-input" value="${escapeHtml(p.name)}" data-action="rename-product" data-product="${p.id}">
        <button class="icon-btn danger" data-action="delete-product" data-product="${p.id}" title="Supprimer le produit">${ICONS.trash}</button>
      </div>
      ${p.variants.map(v => renderVariantRow(p, v)).join('')}
      <button class="add-col-btn" style="margin-top:.8rem;width:100%;" data-action="add-variant" data-product="${p.id}">${ICONS.plus} Ajouter une variante</button>
    </div>
  `;
}

function renderVariantRow(p, v){
  const isPromo = v.currentStatus === 'promo';
  const duration = daysBetween(v.statusSince, todayStr());
  const warnDays = variantComplianceWarning(v);
  const expanded = !!(state.omniExpanded && state.omniExpanded[v.id]);
  return `
    <div class="variant-row">
      <div class="variant-top">
        <input class="variant-name-input" value="${escapeHtml(v.name)}" data-action="rename-variant" data-product="${p.id}" data-variant="${v.id}">
        <div class="variant-badges">
          ${warnDays !== null ? `<span class="variant-warning" title="Seulement ${warnDays} jour(s) de prix normal avant cette promotion (recommandé : 30 jours minimum)">${ICONS.alertTri}</span>` : ''}
          <span class="badge" style="color:${isPromo?'var(--alert)':'var(--positive)'};background:${isPromo?'var(--alert-soft)':'var(--positive-soft)'}">${isPromo?'En promo':'Prix normal'}</span>
        </div>
      </div>
      <div class="variant-bottom">
        <span class="variant-since">Depuis le ${fmtDateLong(v.statusSince)} · <strong>${duration} jour${duration>1?'s':''}</strong></span>
        <div class="variant-actions">
          <button class="btn btn-ghost btn-sm" data-action="toggle-variant-history" data-variant="${v.id}">${ICONS.chevronDown} Historique${v.history.length>1?` (${v.history.length})`:''}</button>
          <button class="btn ${isPromo?'btn-ghost':'btn-primary'} btn-sm" data-action="toggle-variant-status" data-product="${p.id}" data-variant="${v.id}">${isPromo?'Repasser au prix normal':'Marquer en promo'}</button>
          <button class="icon-btn danger" data-action="delete-variant" data-product="${p.id}" data-variant="${v.id}" title="Supprimer la variante">${ICONS.trash}</button>
        </div>
      </div>
      ${expanded ? `
        <div class="variant-history">
          ${[...v.history].reverse().map(h => `<div class="variant-history-item"><span>${fmtDateLong(h.date)}</span><span>${h.status==='promo'?'Passage en promo':'Retour au prix normal'}</span></div>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function variantComplianceWarning(v){
  if(v.currentStatus !== 'promo') return null;
  const hist = v.history;
  if(hist.length < 2) return null;
  const prev = hist[hist.length - 2];
  if(prev.status !== 'normal') return null;
  const normalDuration = daysBetween(prev.date, v.statusSince);
  return normalDuration < 30 ? normalDuration : null;
}

function findVariant(productId, variantId){
  const p = state.omnibusProducts.find(x => x.id === productId);
  if(!p) return null;
  const v = p.variants.find(x => x.id === variantId);
  return v ? { product: p, variant: v } : null;
}

function toggleVariantStatus(productId, variantId){
  const found = findVariant(productId, variantId);
  if(!found) return;
  const { variant } = found;
  const newStatus = variant.currentStatus === 'promo' ? 'normal' : 'promo';
  const today = todayStr();
  variant.history.push({ date: today, status: newStatus });
  variant.currentStatus = newStatus;
  variant.statusSince = today;
  persistOmnibus();
  toast(newStatus === 'promo' ? 'Variante marquée en promotion.' : 'Variante repassée au prix normal.', 'success');
  renderView();
}

function deleteVariant(productId, variantId){
  const p = state.omnibusProducts.find(x => x.id === productId);
  if(!p) return;
  p.variants = p.variants.filter(v => v.id !== variantId);
  persistOmnibus(); renderView();
}
function toggleVariantHistory(variantId){
  if(!state.omniExpanded) state.omniExpanded = {};
  state.omniExpanded[variantId] = !state.omniExpanded[variantId];
  renderView();
}

/* ================= RÉGLAGES ================= */
function renderReglages(){
  return `
    <div class="topbar">
      <div>
        <div class="eyebrow">Application</div>
        <h1 class="page-title">Réglages</h1>
        <p class="page-sub">Informations générales et sécurité de l'outil.</p>
      </div>
    </div>

    <div class="settings-stack">
      <div class="card">
        <div class="section-title">Général</div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Version de l'application</div>
            <div class="settings-sub">Mello Hub</div>
          </div>
          <span class="version-pill">v${APP_VERSION}</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Apparence</div>
            <div class="settings-sub">Clair, sombre ou automatique</div>
          </div>
          ${renderThemeToggle()}
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Accès</div>
            <div class="settings-sub">Verrouiller l'application sur cet appareil</div>
          </div>
          <button class="btn btn-ghost" data-action="lock-app">${ICONS.lock} Verrouiller</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">
          <span>Mise à jour</span>
          <button class="version-pill-btn" data-action="toggle-changelog">
            v${APP_VERSION} ${state.showChangelog ? ICONS.chevronDown.replace('<svg', '<svg style="transform:rotate(180deg)"') : ICONS.chevronDown}
          </button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Statut</div>
            <div class="settings-sub" id="update-status-text">${updateStatusText()}</div>
          </div>
          <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
            ${state.updateCheck.status === 'available' ? `<button class="btn btn-primary" data-action="apply-update">${ICONS.sparkle} Mettre à jour</button>` : ''}
            <button class="btn btn-ghost" data-action="check-update" ${state.updateCheck.status==='checking' ? 'disabled' : ''}>
              ${ICONS.refresh} ${state.updateCheck.status === 'checking' ? 'Recherche…' : 'Rechercher une mise à jour'}
            </button>
          </div>
        </div>
        ${state.showChangelog ? `
          <div class="changelog-list">
            ${CHANGELOG.map(c => `
              <div class="changelog-item">
                <span class="changelog-version">v${c.version}</span><span class="changelog-date">${c.date}</span>
                <div class="changelog-notes">${escapeHtml(c.notes)}</div>
              </div>`).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

/* ================= EVENTS ================= */
function attachGlobalHandlers(){
  document.body.onclick = null; // avoid duplicate binding across re-shells
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('input', handleInput);
  window.addEventListener('resize', () => positionPill(true));
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el){
    if(e.target.id === 'offer-backdrop') closeModal();
    return;
  }
  const action = el.dataset.action;

  if(action === 'go-view'){
    state.currentView = el.dataset.view;
    saveJSON(STORAGE.view, state.currentView);
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    positionPill(false);
    renderView();
  }
  else if(action === 'set-theme'){
    saveJSON(STORAGE.theme, el.dataset.theme);
    applyTheme();
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }
  else if(action === 'open-offer-modal') openOfferModal(null);
  else if(action === 'edit-offer') openOfferModal(el.dataset.id);
  else if(action === 'delete-offer') deleteOffer(el.dataset.id);
  else if(action === 'save-offer') saveOfferFromModal(el.dataset.id || null);
  else if(action === 'close-modal') closeModal();
  else if(action === 'offres-view'){ state.offresViewMode = el.dataset.mode; renderView(); }
  else if(action === 'cal-prev'){ shiftMonth(-1); }
  else if(action === 'cal-next'){ shiftMonth(1); }
  else if(action === 'cal-today'){ const n = new Date(); state.calMonth = { y:n.getFullYear(), m:n.getMonth() }; state.calSelected = todayStr(); renderView(); }
  else if(action === 'cal-select'){ state.calSelected = state.calSelected === el.dataset.date ? null : el.dataset.date; renderView(); }
  else if(action === 'open-marker-modal') openMarkerModal(el.dataset.date);
  else if(action === 'save-marker') saveMarkerFromModal();
  else if(action === 'delete-marker') deleteDayMarker(el.dataset.id);
  else if(action === 'add-product') addProduct();
  else if(action === 'delete-product') deleteProduct(el.dataset.product);
  else if(action === 'add-variant') addVariant(el.dataset.product);
  else if(action === 'delete-variant') deleteVariant(el.dataset.product, el.dataset.variant);
  else if(action === 'toggle-variant-status') toggleVariantStatus(el.dataset.product, el.dataset.variant);
  else if(action === 'toggle-variant-history') toggleVariantHistory(el.dataset.variant);
  else if(action === 'lock-app') lockApp();
  else if(action === 'check-update') checkForUpdate(true);
  else if(action === 'apply-update') applyUpdate();
  else if(action === 'toggle-changelog'){ state.showChangelog = !state.showChangelog; renderView(); }
}

function handleInput(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'rename-product'){
    const p = state.omnibusProducts.find(x => x.id === el.dataset.product);
    if(p){ p.name = el.value; persistOmnibus(); }
  }
  else if(action === 'rename-variant'){
    const found = findVariant(el.dataset.product, el.dataset.variant);
    if(found){ found.variant.name = el.value; persistOmnibus(); }
  }
}

function shiftMonth(delta){
  let { y, m } = state.calMonth;
  m += delta;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  state.calMonth = { y, m };
  renderView();
}

/* ================= INIT ================= */
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(loadJSON(STORAGE.theme, 'auto') === 'auto') applyTheme();
});
if(isUnlocked()) renderShell(); else renderLock();
</script>
</body>
</html>
