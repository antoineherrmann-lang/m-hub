<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mello Hub">
<meta name="theme-color" content="#007AFF">
<title>Mello Hub</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F7F9;
    --card:#FFFFFF;
    --card-glass:rgba(255,255,255,0.66);
    --glass-bg:linear-gradient(135deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.32) 100%);
    --glass-border:rgba(0,0,0,0.08);
    --glass-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 4px rgba(0,0,0,0.05);
    --ink:#000000;
    --muted:rgba(60,60,67,0.6);
    --border:rgba(60,60,67,0.14);
    --accent:#007AFF;
    --accent-2:#5AC8FA;
    --accent-soft:rgba(0,122,255,0.12);
    --positive:#34C759;
    --positive-soft:rgba(52,199,89,0.14);
    --negative:#FF3B30;
    --negative-soft:rgba(255,59,48,0.12);
    --alert:#FF9500;
    --alert-soft:rgba(255,149,0,0.14);
    --violet:#AF52DE;
    --violet-soft:rgba(175,82,222,0.12);
    --radius:18px;
    --radius-sm:13px;
    --shadow-soft: 0 1px 3px rgba(14,27,44,0.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.005em;
    transition:background .3s ease, color .3s ease;
  }
  h1,h2,h3,h4{font-weight:600;margin:0;letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  html,body{width:100%;background:var(--bg);}
  #app.shell{display:flex;min-height:100dvh;}

  /* ---------- Sidebar / Nav (shared markup, two layouts) ---------- */
  .sidebar{
    width:236px;flex-shrink:0;position:sticky;top:0;height:100dvh;
    padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.75rem;
    border-right:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:.65rem;padding:0 .35rem;}
  .brand-badge{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block;object-fit:cover;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 10px rgba(8,26,52,0.35);
  }
  .brand-name{font-weight:600;font-size:1rem;line-height:1.1;}
  .brand-sub{font-size:.68rem;color:var(--muted);font-weight:500;}

  .nav-shell{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;}
  .nav{
    position:relative;display:flex;flex-direction:column;gap:.15rem;padding:.35rem;border-radius:var(--radius);
    background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  }
  .nav-secondary{
    margin-top:auto;display:flex;flex-direction:column;padding:.35rem;border-radius:var(--radius);
    background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  }
  .nav-pill{
    position:absolute;top:0;left:0;border-radius:9px;z-index:0;
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  }
  .nav-item{
    position:relative;z-index:1;display:flex;align-items:center;gap:.7rem;
    padding:.62rem .75rem;border-radius:9px;cursor:pointer;color:var(--muted);
    font-size:.86rem;font-weight:500;transition:color .2s ease;user-select:none;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item.active{color:var(--accent);}
  .nav-item:not(.active):hover{color:var(--ink);}
  .nav-secondary .nav-item{z-index:auto;}
  .nav-secondary .nav-item.active{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.10);}
  .nav-secondary .nav-item:not(.active):hover{background:var(--card);}
  .nav-label-full{display:inline;}
  .nav-label-compact{display:none;}

  .sidebar-foot{display:flex;flex-direction:column;gap:.6rem;}
  .foot-note{font-size:.66rem;color:var(--muted);padding:0 .35rem;line-height:1.4;}

  /* ---------- Main content ---------- */
  .main{flex:1;min-width:0;max-width:1360px;padding:calc(1.75rem + env(safe-area-inset-top, 0px)) 2.25rem calc(3rem + env(safe-area-inset-bottom,0px));}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap;}
  .eyebrow{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;}
  .page-title{font-size:1.7rem;}
  .page-sub{color:var(--muted);font-size:.88rem;margin-top:.35rem;}
  .topbar-actions{display:flex;gap:.6rem;align-items:center;}

  .btn{
    border:none;border-radius:999px;padding:.65rem 1.15rem;font-weight:500;font-size:.85rem;cursor:pointer;
    display:inline-flex;align-items:center;gap:.45rem;transition:transform .15s ease, filter .15s ease, background .15s ease, color .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:focus{outline:none;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:none;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-positive{background:var(--positive);color:#fff;box-shadow:none;}
  .btn-positive:hover{filter:brightness(1.06);}
  .btn-block{width:100%;justify-content:center;}
  .btn-ghost{background:transparent;color:var(--btn-color, var(--ink));border:1.5px solid var(--btn-color, var(--ink));}
  .btn-ghost:hover{background:var(--btn-color, var(--ink));color:#fff;}
  .btn-danger-text{background:transparent;color:var(--negative);padding:.4rem .5rem;}
  .btn svg{width:15px;height:15px;}

  .segmented{
    display:inline-flex;gap:.2rem;padding:.25rem;border-radius:14px;
    background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  }
  .segmented button{
    border:none;background:transparent;padding:.5rem .9rem;border-radius:10px;
    font-size:.8rem;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .segmented button svg{width:15px;height:15px;flex-shrink:0;}
  .segmented button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:1rem;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);margin-bottom:1.4rem;}
  .card{
    background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);
    padding:1.15rem 1.3rem;box-shadow:var(--shadow-soft);
  }
  .kpi-card{
    display:flex;flex-direction:column;gap:.9rem;
    border-radius:18px;padding:1.2rem 1.3rem;min-height:136px;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-soft);color:var(--ink);
    justify-content:flex-start;
  }
  .kpi-icon-badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .kpi-icon-badge svg{width:18px;height:18px;}
  .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;}
  .kpi-card-label{font-size:.83rem;font-weight:500;color:var(--muted);}
  .kpi-value-row{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-top:auto;}
  .kpi-value{font-size:1.65rem;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
  .kpi-value-sub{font-size:.78rem;font-weight:500;color:var(--muted);}

  .section-title{font-size:1rem;font-weight:600;margin:0 0 .85rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
  .section-title span.count{color:var(--muted);font-weight:500;font-size:.8rem;}

  .two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;align-items:start;}

  /* Upcoming offer list — pill rows */
  .offer-mini{
    display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;border-radius:16px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .offer-mini + .offer-mini{margin-top:.55rem;}
  .offer-mini:hover{border-color:var(--accent);background:var(--accent-soft);}
  .offer-mini:active{transform:scale(0.99);}
  .offer-mini-body{flex:1;min-width:0;}
  .offer-dot{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,0.4);
  }
  .offer-mini-title{font-weight:500;font-size:.86rem;}
  .offer-mini-title-lg{font-weight:600;font-size:1.02rem;letter-spacing:-0.01em;}
  .offer-mini-sub{font-size:.74rem;color:var(--muted);margin-top:.2rem;}
  .offer-mini-badge{margin-left:auto;font-size:.7rem;font-weight:600;padding:.28rem .6rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .empty-state{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.85rem;}
  .empty-state svg{width:32px;height:32px;margin-bottom:.6rem;opacity:.5;}

  /* Bar chart */
  .chart-wrap{position:relative;}
  .bar-row{display:flex;align-items:flex-end;gap:.65rem;height:120px;padding-top:.5rem;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.4rem;height:100%;justify-content:flex-end;}
  .bar-shape{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent-2),var(--accent));min-height:4px;}
  .bar-label{font-size:.66rem;color:var(--muted);font-weight:600;}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-soft);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  thead th{
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    font-weight:600;padding:.85rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:.8rem 1rem;font-size:.86rem;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  .cell-title{font-weight:500;}
  .cell-sub{color:var(--muted);font-size:.72rem;margin-top:.15rem;}
  .badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.3rem .65rem;border-radius:20px;}
  .row-actions{display:flex;gap:.3rem;justify-content:flex-end;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .icon-btn.danger:hover{background:var(--negative-soft);color:var(--negative);}
  .icon-btn:active{transform:scale(0.88);}
  .icon-btn svg{width:15px;height:15px;}
  .reorder-btns{display:flex;flex-direction:column;gap:1px;}
  .reorder-btn{width:20px;height:16px;border-radius:4px;}
  .reorder-btn svg{width:11px;height:11px;}
  .reorder-btn:disabled{opacity:.25;cursor:default;pointer-events:none;}
  .add-variant-btn{
    display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:500;color:var(--muted);
    background:transparent;border:1px solid var(--border);border-radius:999px;padding:.32rem .6rem;cursor:pointer;
    font-family:inherit;transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .add-variant-btn svg{width:12px;height:12px;}
  .add-variant-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}
  .add-variant-btn:active{transform:scale(0.94);}
  .tag-chip{font-size:.7rem;font-weight:600;padding:.22rem .55rem;border-radius:8px;background:var(--accent-soft);color:var(--accent);}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .cal-nav{display:flex;gap:.4rem;}
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  }
  .cal-dow{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:.55rem 0;background:var(--card);}
  .cal-day{
    min-height:96px;border:none;padding:.45rem .4rem .4rem;position:relative;
    cursor:pointer;background:var(--card);color:var(--ink);
    display:flex;flex-direction:column;gap:.3rem;
    transition:background .12s ease;
  }
  .cal-day.outside{opacity:.28;cursor:default;min-height:auto;}
  .cal-day:hover:not(.outside):not(.selected){background:var(--surface);}
  .cal-day-top{display:flex;align-items:center;justify-content:space-between;}
  .cal-day-num{font-size:.78rem;font-weight:500;color:var(--muted);}
  .cal-day.today .cal-day-num{
    color:#fff;background:var(--accent);width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;
  }
  .cal-day.selected{background:var(--accent-soft);}
  .cal-day-offers{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;}
  .cal-offer-chip{
    height:18px;display:flex;align-items:center;font-size:.6rem;font-weight:500;
    margin:0 -.4rem;padding:0 .4rem;border-radius:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cal-offer-chip.cap-left{border-top-left-radius:5px;border-bottom-left-radius:5px;}
  .cal-offer-chip.cap-right{border-top-right-radius:5px;border-bottom-right-radius:5px;}
  .cal-offer-more{font-size:.6rem;color:var(--muted);font-weight:500;padding:0 .3rem;}
  .cal-day-markers{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:.2rem;}
  .cal-marker-dot{width:15px;height:15px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
  .cal-marker-dot svg{width:8px;height:8px;}
  .cal-marker-more{font-size:.58rem;color:var(--muted);font-weight:600;}
  .cal-day-popover{
    position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px) scale(.96);
    transform-origin:bottom center;
    min-width:200px;max-width:270px;background:var(--card-glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--border);border-radius:14px;padding:.7rem .8rem;box-shadow:0 12px 30px rgba(0,0,0,0.14);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease, transform .16s ease;z-index:30;text-align:left;
  }
  .cal-day-popover.align-start{left:0;transform:translateY(4px) scale(.96);transform-origin:bottom left;}
  .cal-day-popover.align-end{left:auto;right:0;transform:translateY(4px) scale(.96);transform-origin:bottom right;}
  @media (hover:hover){
    .cal-day:hover .cal-day-popover{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1);}
    .cal-day:hover .cal-day-popover.align-start{transform:translateY(0) scale(1);}
    .cal-day:hover .cal-day-popover.align-end{transform:translateY(0) scale(1);}
  }
  .cal-popover-date{font-size:.68rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;}
  .cal-popover-offer{padding:.3rem 0;}
  .cal-popover-offer + .cal-popover-offer{border-top:1px solid var(--border);margin-top:.2rem;}
  .cal-popover-row{display:flex;align-items:center;gap:.4rem;font-size:.76rem;font-weight:500;color:var(--ink);padding:.1rem 0;}
  .cal-popover-row.muted{color:var(--muted);font-weight:500;}
  .cal-popover-meta{font-size:.68rem;color:var(--muted);padding-left:.85rem;line-height:1.4;display:flex;align-items:flex-start;gap:.3rem;}
  .cal-popover-meta svg{width:11px;height:11px;flex-shrink:0;margin-top:.15rem;}
  .cal-popover-sep{height:1px;background:var(--border);margin:.4rem 0;}
  .cal-popover-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .cal-day-list{
    margin-top:1rem;padding:1rem 1.1rem;border-radius:14px;background:var(--surface);
    animation:dayDetailIn .3s cubic-bezier(.22,.9,.32,1) both;
  }
  @keyframes dayDetailIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .day-markers-section{margin-top:1rem;padding-top:.85rem;border-top:1px dashed var(--border);}
  .day-markers-head{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;margin-bottom:.5rem;}
  .marker-chip{display:flex;align-items:center;gap:.6rem;padding:.4rem .2rem;font-size:.82rem;}
  .marker-chip-body{flex:1;min-width:0;}
  .marker-chip-label{font-weight:500;}
  .marker-chip-note{font-size:.72rem;color:var(--muted);margin-top:.15rem;}
  .marker-chip-icon{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .marker-chip-icon svg{width:13px;height:13px;}
  .marker-type-row{
    display:flex;flex-wrap:wrap;gap:.2rem;padding:.25rem;border-radius:14px;
    background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  }
  .marker-type-btn{
    flex:1 1 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;padding:.6rem .4rem;min-height:64px;
    border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-family:inherit;font-size:.68rem;font-weight:500;transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .marker-type-btn svg{width:16px;height:16px;}
  .marker-type-btn.selected{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  /* Résumé des durées */
  .duration-row{display:flex;flex-direction:column;gap:.5rem;padding:.7rem 0;border-bottom:1px solid var(--border);}
  .duration-row:last-child{border-bottom:none;}
  .duration-row-top{display:flex;align-items:center;gap:.6rem;}
  .duration-title{font-weight:500;font-size:.85rem;flex:1;}
  .duration-row-bottom{display:flex;align-items:center;gap:.65rem;}
  .duration-bar{flex:1;height:5px;border-radius:3px;background:var(--surface);overflow:hidden;}
  .duration-bar-fill{height:100%;border-radius:3px;transition:width .3s ease;}
  .duration-value{font-size:.72rem;color:var(--muted);white-space:nowrap;min-width:96px;text-align:right;flex-shrink:0;}

  /* Sous-offres (affichage : puces produit + promotion) */
  .sub-offer-chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}
  .tag-chip strong{font-weight:700;}

  /* Lignes "Offres" appariées (Produit / Promotion) dans la modale */
  .offer-items-head{display:grid;grid-template-columns:1fr 1fr 30px;gap:.5rem;margin-bottom:.4rem;}
  .offer-items-head span{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .offer-items-list{display:flex;flex-direction:column;gap:.5rem;}
  .offer-item-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:.5rem;align-items:center;}
  .offer-item-input{
    width:100%;padding:.6rem .7rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:.85rem;
  }
  .offer-item-input:focus{outline:none;border-color:var(--accent);}
  /* ---------- Omnibus — suivi produits / variantes ---------- */
  .add-col-btn{
    display:flex;align-items:center;justify-content:center;gap:.4rem;min-width:120px;border:1.5px dashed var(--border);

  .offer-subsection-label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:.4rem;}
  .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.3rem;}

  /* toast */
  .toast-wrap{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.5rem;align-items:center;}
  .toast{
    background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);

    font-size:.8rem;font-weight:500;box-shadow:var(--glass-shadow), 0 10px 28px rgba(0,0,0,0.12);

  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .toast.error{color:var(--negative);}
  .toast.success{color:var(--positive);}

  .view-fade{animation:viewFade .38s cubic-bezier(.22,.9,.32,1) both;}
  @keyframes viewFade{from{opacity:0;filter:blur(8px);transform:scale(.99);}to{opacity:1;filter:blur(0);transform:scale(1);}}

  /* ---------- Lock screen ---------- */
  .lock-screen{
    width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem 1.5rem;gap:2.75rem;position:relative;overflow:hidden;

    position:relative;z-index:1;width:100%;max-width:280px;padding:1.4rem;border-radius:22px;
    background:rgba(255,255,255,0.16);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);

  }
  @keyframes lockPanelIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .lock-field{position:relative;width:100%;margin-bottom:.75rem;}
  .lock-field input{
    width:100%;padding:.75rem 1rem;border-radius:13px;border:1px solid rgba(255,255,255,0.4);

  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

  /* =========================================================
     Responsive — 4 paliers cohérents
     Desktop (>1100px) · Tablette (761–1100px) · Mobile (≤760px) · Petit mobile (≤420px)
     ========================================================= */

  /* ---- Tablette : la nav latérale reste, mais l'espace se resserre ---- */
  @media (max-width:1100px){
    .main{padding:calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(2.5rem + env(safe-area-inset-bottom,0px));}

      background:var(--card-glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);

    .page-title{font-size:1.4rem;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:.75rem;}

    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }

/* ---------------- Storage helpers ---------------- */
function loadJSON(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ toast("Impossible d'enregistrer les données.", "error"); return false; }
}
function uid(){ return Math.random().toString(36).slice(2,10); }

const STORAGE = {
  offres: 'mellohub_offres',
  omnibus: 'mellohub_omnibus_products',
  dayMarkers: 'mellohub_daymarkers',
  view: 'mellohub_lastview',
  unlocked: 'mellohub_unlocked',
  syncToken: 'mellohub_sync_token',
  syncGistId: 'mellohub_sync_gist_id',
  dataUpdatedAt: 'mellohub_data_updated_at'
};

/* ---------------- Version & changelog ---------------- */
const APP_VERSION = '1.5.8';
const CHANGELOG = [
  { version:'1.5.8', date:'Août 2026', notes:"Nouveau logo Mello Hub. Écran de connexion repensé : la marque (logo, titre, sous-titre) s'affiche désormais directement sur le fond d'écran en blanc, et le verre liquide se concentre uniquement sur le formulaire — un rendu plus simple et plus élégant." },
  { version:'1.5.7', date:'Août 2026', notes:"Correction du titre de produit tronqué dans Omnibus (largeur en pourcentage instable remplacée par une valeur fixe). Correction d'une structure HTML cassée qui empêchait la carte « Données » de Réglages de prendre toute la largeur. Nouveau fond d'écran sur l'écran de connexion, avec effet de verre liquide par-dessus." },
  { version:'1.5.6', date:'Août 2026', notes:"Réorganisation des produits dans Omnibus (flèches monter/descendre). Correction définitive du champ nom (mesure réelle du texte affiché au lieu de l'attribut size approximatif). Synchronisation entre Mac via Gist GitHub chiffré (AES-256-GCM), avec connexion par token dans Réglages, synchronisation automatique à l'ouverture et bouton manuel." },
  { version:'1.5.5', date:'Août 2026', notes:"Correction définitive de la largeur des champs de nom (produit/variante) : ils épousent désormais réellement la longueur du texte au lieu de garder une largeur fixe invisible, ce qui collait vraiment le badge au titre. Bouton « Ajouter une variante » en pilule complètement arrondie. Boutons « Annuler la promo »/« Activer une promo » alignés sur une largeur identique, ce dernier passé en vert." },
  { version:'1.5.4', date:'Août 2026', notes:"Renumérotation des versions (1.6.x → 1.5.x). Mise à jour recherchée et appliquée automatiquement à l'ouverture de l'app, sans action requise. Omnibus : badge resserré davantage contre le nom de la variante, bouton « Ajouter une variante » réduit et neutralisé en gris (comme les icônes Dupliquer/Supprimer). Ajout de micro-animations sur les boutons, lignes et éléments interactifs de toute l'app." },
  { version:'1.5.3', date:'Août 2026', notes:"Omnibus : icône de modification pour ajuster une promo déjà active, badge de statut resserré contre le nom de la variante, bouton « Activer une promo » repassé en plein bleu, « Ajouter une variante » déplacé en haut du produit. Champ Réduction de la modale de promo corrigé (taille cohérente avec les autres champs, plus de valeur par défaut trompeuse)." },
  { version:'1.5.2', date:'Août 2026', notes:"Omnibus repensé : badge et actions regroupés en haut de chaque variante (historique, dupliquer, supprimer, activer/annuler), champs d'information plus espacés, palette neutralisée (Promo désactivée en gris, boutons de statut neutres), duplication de produit, cartes KPI retirées en attendant une refonte. Modale de promo enrichie : réduction en grand format, durée liée automatiquement aux dates de début/fin, titre reprenant produit + variante. Réglages : export/import des données au format JSON, mention de développement en bas de page." },
  { version:'1.5.1', date:'Août 2026', notes:"Omnibus : les informations de chaque variante (réduction, début, fin, temps restant) s'affichent désormais dans des champs distincts et toujours visibles, en reprenant la hiérarchie du tableau fourni, au lieu d'être fondues dans le badge de statut." },
  { version:'1.5.0', date:'Août 2026', notes:"Refonte d'Omnibus : véritable outil de gestion de promo par variante (pourcentage + dates de début/fin, réintégration automatique au prix normal à échéance), indicateur visuel de temps restant, badge « Promo active » avec halo animé, bouton dupliquer une variante, mise en page plus compacte. Fond des offres du jour légèrement allégé." },
  { version:'1.4.9', date:'Août 2026', notes:"Offres du jour redessinées (plus de pastille, titre plus gros, fond en dégradé subtil de la couleur de l'offre), bouton « Ajouter » directement dans le détail du jour sélectionné, les offres terminées disparaissent automatiquement de « Durée des offres » (restent visibles dans le tableau), notifications sans point final." },
  { version:'1.4.8', date:'Août 2026', notes:"Élément de menu sélectionné en bleu, correction du rognage de la pop-up de survol sur les jours en bordure du calendrier, détail du jour sélectionné redessiné (fond distinct + animation d'apparition), offre du jour entièrement cliquable pour modifier avec boutons Dupliquer/Supprimer/Modifier dédiés." },

/* ---------------- Système de mise à jour ----------------
   Compare la version locale à celle du index.html publié sur l'hébergement.
   Fonctionne uniquement lorsque l'app est servie via http(s) (GitHub Pages, etc.) —
   ouverte en fichier local (file://), la vérification n'est pas possible. */
function compareVersions(a, b){
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const diff = (pa[i]||0) - (pb[i]||0);
    if(diff !== 0) return diff > 0 ? 1 : -1;
  }
  return 0;
}

async function checkForUpdate(manual){
  state.updateCheck = { status:'checking', version:null, checkedAt:null };
  if(manual) renderView();
  try{
    const res = await fetch('./index.html?_=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('http-' + res.status);
    const html = await res.text();
    const match = html.match(/APP_VERSION\s*=\s*['"]([\d.]+)['"]/);
    if(!match) throw new Error('version-not-found');
    const remoteVersion = match[1];
    const cmp = compareVersions(remoteVersion, APP_VERSION);
    state.updateCheck = { status: cmp > 0 ? 'available' : 'uptodate', version: remoteVersion, checkedAt: new Date() };
    if(cmp > 0 && !manual){
      toast(`Mise à jour v${remoteVersion} disponible — application…`, 'success');
      applyUpdate(true);
      return;
    }
  }catch(e){
    // Échec silencieux (app ouverte en local, hors-ligne...) — on revient simplement à l'état neutre.
    state.updateCheck = { status:'idle', version:null, checkedAt:null };
  }
  if(state.currentView === 'reglages') renderView();
}

function applyUpdate(silent){
  if(!silent) toast('Mise à jour en cours…', 'success');
  setTimeout(() => { window.location.href = window.location.pathname + '?_=' + Date.now(); }, silent ? 700 : 400);
}

function updateStatusText(){
  const uc = state.updateCheck;
  if(uc.status === 'checking') return 'Recherche en cours…';
  if(uc.status === 'available') return `Nouvelle version disponible : v${uc.version}`;
  if(uc.status === 'uptodate') return `Vous utilisez déjà la dernière version.`;
  return `Dernière vérification non effectuée.`;
}

/* ---------------- Synchronisation entre appareils (Gist GitHub chiffré) ----------------
   Repose sur un Gist GitHub privé comme base de données minimaliste. Le token
   (scope "gist" uniquement) est le même sur chaque appareil à synchroniser.
   Le contenu du Gist est chiffré en AES-256-GCM avec une clé dérivée du token
   lui-même (SHA-256) — jamais du mot de passe local de l'app. */
const SYNC_GIST_FILENAME = 'mellohub-sync.json';
const SYNC_GIST_DESCRIPTION = 'Mello Hub — données chiffrées, ne pas modifier manuellement';

async function deriveSyncKey(token){
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
  return crypto.subtle.importKey('raw', hash, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
}
function bufToBase64(buf){
  let binary = '';
  const bytes = new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function encryptSyncPayload(token, obj){
  const key = await deriveSyncKey(token);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data);
  const combined = new Uint8Array(iv.length + cipher.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipher), iv.length);
  return bufToBase64(combined);
}
async function decryptSyncPayload(token, b64){
  const key = await deriveSyncKey(token);
  const combined = base64ToBuf(b64);
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

function ghHeaders(token){
  return { 'Authorization': `Bearer ${token}`, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
}

async function findSyncGistId(token){
  for(let page=1; page<=5; page++){
    const res = await fetch(`https://api.github.com/gists?per_page=100&page=${page}`, { headers: ghHeaders(token) });
    if(!res.ok) throw new Error('gist-list-' + res.status);
    const gists = await res.json();
    if(!gists.length) break;
    const found = gists.find(g => g.files && g.files[SYNC_GIST_FILENAME]);
    if(found) return found.id;
    if(gists.length < 100) break;
  }
  return null;
}
async function createSyncGist(token, content){
  const res = await fetch('https://api.github.com/gists', {
    method:'POST', headers: { ...ghHeaders(token), 'Content-Type':'application/json' },
    body: JSON.stringify({ description: SYNC_GIST_DESCRIPTION, public:false, files:{ [SYNC_GIST_FILENAME]: { content } } })
  });
  if(!res.ok) throw new Error('gist-create-' + res.status);
  const data = await res.json();
  return data.id;
}
async function updateSyncGist(token, gistId, content){
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    method:'PATCH', headers: { ...ghHeaders(token), 'Content-Type':'application/json' },
    body: JSON.stringify({ files:{ [SYNC_GIST_FILENAME]: { content } } })
  });
  if(!res.ok) throw new Error('gist-update-' + res.status);
}
async function fetchSyncGistContent(token, gistId){
  const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: ghHeaders(token) });
  if(!res.ok) throw new Error('gist-fetch-' + res.status);
  const data = await res.json();
  const file = data.files && data.files[SYNC_GIST_FILENAME];
  if(!file) throw new Error('gist-file-missing');
  return file.content;
}

function getSyncToken(){ return loadJSON(STORAGE.syncToken, null); }
function localDataUpdatedAt(){ return parseInt(localStorage.getItem(STORAGE.dataUpdatedAt) || '0', 10); }

async function performSync(manual){
  const token = getSyncToken();
  if(!token){ if(manual) toast('Aucun compte GitHub connecté', 'error'); return; }
  state.syncStatus = { ...(state.syncStatus||{}), status:'syncing' };
  if(manual && state.currentView === 'reglages') renderView();
  try{
    let gistId = loadJSON(STORAGE.syncGistId, null);
    if(!gistId) gistId = await findSyncGistId(token);

    const localPayload = { updatedAt: localDataUpdatedAt() || Date.now(), offres: state.offres, omnibusProducts: state.omnibusProducts, dayMarkers: state.dayMarkers };

    if(!gistId){
      const encrypted = await encryptSyncPayload(token, localPayload);
      gistId = await createSyncGist(token, encrypted);
      saveJSON(STORAGE.syncGistId, gistId);
      state.syncStatus = { status:'synced', lastSync: Date.now(), direction:'init' };
      toast('Synchronisation initialisée', 'success');
    }else{
      saveJSON(STORAGE.syncGistId, gistId);
      const remoteContent = await fetchSyncGistContent(token, gistId);
      const remotePayload = await decryptSyncPayload(token, remoteContent);
      const remoteUpdatedAt = (remotePayload && remotePayload.updatedAt) || 0;

      if(remoteUpdatedAt > localPayload.updatedAt){
        state.offres = remotePayload.offres || [];
        state.omnibusProducts = migrateOmnibusProducts(remotePayload.omnibusProducts || []);
        state.dayMarkers = migrateDayMarkers(remotePayload.dayMarkers || []);
        saveJSON(STORAGE.offres, state.offres);
        saveJSON(STORAGE.omnibus, state.omnibusProducts);
        saveJSON(STORAGE.dayMarkers, state.dayMarkers);
        localStorage.setItem(STORAGE.dataUpdatedAt, String(remoteUpdatedAt));
        state.syncStatus = { status:'synced', lastSync: Date.now(), direction:'pull' };
        toast('Données récupérées', 'success');
      }else{
        const encrypted = await encryptSyncPayload(token, localPayload);
        await updateSyncGist(token, gistId, encrypted);
        state.syncStatus = { status:'synced', lastSync: Date.now(), direction:'push' };
        toast('Données envoyées', 'success');
      }
    }
  }catch(e){
    state.syncStatus = { status:'error', lastSync: state.syncStatus?.lastSync, error: e.message };
    if(manual) toast('Échec de la synchronisation', 'error');
  }
  if(state.currentView === 'reglages') renderView();
  else if(state.currentView === 'offres' || state.currentView === 'omnibus' || state.currentView === 'dashboard') renderView();
}

function syncStatusLabel(){
  const s = state.syncStatus;
  if(!s || s.status === 'idle') return 'Jamais synchronisé sur cet appareil.';
  if(s.status === 'syncing') return 'Synchronisation en cours…';
  if(s.status === 'error') return `Échec de la dernière synchronisation.`;
  if(s.status === 'synced'){
    const time = s.lastSync ? new Date(s.lastSync).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }) : '';
    const dir = s.direction === 'pull' ? ' (données récupérées)' : s.direction === 'push' ? ' (données envoyées)' : '';
    return `Synchronisé à ${time}${dir}`;
  }
  return 'Statut inconnu.';
}

function saveSyncTokenFromInput(){
  const input = document.getElementById('sync-token-input');
  if(!input) return;
  const val = input.value.trim();
  if(!val){ toast('Merci de coller un token', 'error'); return; }
  saveJSON(STORAGE.syncToken, val);
  state.syncStatus = { status:'idle' };
  toast('Token enregistré', 'success');
  performSync(true);
}
function disconnectSync(){
  localStorage.removeItem(STORAGE.syncToken);
  localStorage.removeItem(STORAGE.syncGistId);
  state.syncStatus = null;
  renderView();
  toast('Compte GitHub déconnecté', 'success');
}

/* ---------------- Accès protégé par mot de passe ----------------
   Le mot de passe n'est jamais stocké en clair : seule son empreinte
   SHA-256 est comparée à celle saisie par l'utilisateur. */
const ACCESS_HASH = '91dcdf174d85b852069eff7890f683e400651df14f54b892b71a6f7a70e524f0';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* Migration silencieuse : les anciens repères (v1.2.0) avaient un champ `date`
   unique ; on le convertit en startDate/endDate + couleur par défaut, sans perte. */
function migrateDayMarkers(markers){
  return markers.map(mk => ({
    id: mk.id,
    startDate: mk.startDate || mk.date,
    endDate: mk.endDate || mk.date || mk.startDate,
    icon: mk.icon || 'custom',
    label: mk.label || '',
    color: mk.color || '#5AC8FA',
    note: mk.note || ''
  }));
}
function seedDayMarkers(){
  const today = new Date();
  const d = (offset) => { const x = new Date(today); x.setDate(x.getDate()+offset); return x.toISOString().slice(0,10); };
  return [
    { id: uid(), startDate: d(2), endDate: d(2), icon:'newsletter', label:'Envoi newsletter', color:'#007AFF' },
    { id: uid(), startDate: d(6), endDate: d(9), icon:'countdown', label:'Décompte fin des soldes', color:'#FF3B30' }
  ];
}
/* Suivi Omnibus — un produit a plusieurs variantes ; chaque variante garde un
   historique de ses changements de statut (normal / promo) pour connaître
   depuis quand elle est dans son état actuel, et détecter les périodes de
   prix normal trop courtes (<30 jours) avant une promotion. Chaque promotion
   a désormais un pourcentage de réduction et une durée définie (début/fin). */
function seedOmnibusProducts(){
  const today = new Date();
  const daysAgo = (n) => { const x = new Date(today); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };
  function variant(name, seedDays){
    return {
      id: uid(), name, currentStatus:'normal', statusSince: daysAgo(seedDays),
      promoPercent:null, promoStart:null, promoEnd:null,
      history:[{date:daysAgo(seedDays), status:'normal'}]
    };
  }
  function product(name){
    return { id: uid(), name, variants:[ variant('Classique', 52), variant('Pure+', 52) ] };
  }
  return [ product('Matelas Relax'), product('Matelas Hybride'), product('Matelas Max') ];
}
/* Complète les variantes enregistrées avant l'ajout des champs promo (rétrocompatibilité). */
function migrateOmnibusProducts(products){
  return products.map(p => ({
    ...p,
    variants: p.variants.map(v => ({ promoPercent:null, promoStart:null, promoEnd:null, ...v }))
  }));
}
function addDaysStr(ds, n){ const d = parseDate(ds); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
/* Repasse automatiquement au prix normal toute variante dont la promo est arrivée à échéance. */
function reconcileExpiredPromos(){
  const t = todayStr();
  let changed = false;
  state.omnibusProducts.forEach(p => p.variants.forEach(v => {
    if(v.currentStatus === 'promo' && v.promoEnd && v.promoEnd < t){
      const nextDay = addDaysStr(v.promoEnd, 1);
      const since = nextDay <= t ? nextDay : t;
      v.currentStatus = 'normal';
      v.statusSince = since;
      v.history.push({ date: since, status:'normal' });
      changed = true;
    }
  }));
  if(changed) persistOmnibus();
}

let state = {
  offres: loadJSON(STORAGE.offres, null) || seedOffres(),

/* ---------------- Utils ---------------- */
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()].slice(0,3); }
function fmtDateLong(s){ const d = parseDate(s); return d.getDate() + ' ' + MONTHS_FR[d.getMonth()] + ' ' + d.getFullYear(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function offerStatus(o){
  const t = todayStr();
  if(o.end < t) return 'passee';
  if(o.start <= t && o.end >= t) return 'active';
  return 'avenir';
}
const STATUS_META = {
  avenir: { label:'À venir', color:'var(--accent)', soft:'var(--accent-soft)' },
  active: { label:'En cours', color:'var(--positive)', soft:'var(--positive-soft)' },
  passee: { label:'Terminée', color:'var(--muted)', soft:'rgba(91,107,130,0.12)' }
};
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Ajuste la largeur d'un champ texte à la taille réelle de son contenu (en pixels),
   en mesurant le texte avec sa police exacte — bien plus fiable que l'attribut
   HTML `size`, qui se base sur une largeur de caractère moyenne approximative. */
function autosizeInput(el){
  let measurer = document.getElementById('input-measurer');
  if(!measurer){
    measurer = document.createElement('span');
    measurer.id = 'input-measurer';
    measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:-9999px;left:-9999px;pointer-events:none;';
    document.body.appendChild(measurer);
  }
  const cs = getComputedStyle(el);
  measurer.style.fontFamily = cs.fontFamily;
  measurer.style.fontSize = cs.fontSize;
  measurer.style.fontWeight = cs.fontWeight;
  measurer.style.letterSpacing = cs.letterSpacing;
  measurer.textContent = el.value && el.value.length ? el.value : (el.placeholder || ' ');
  el.style.width = (measurer.offsetWidth + 12) + 'px';
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ---------------- Toasts ---------------- */
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = (kind==='success'?ICONS.check:kind==='error'?ICONS.alertTri:'') + '<span>' + escapeHtml(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(8px)'; el.style.transition='all .25s ease'; setTimeout(()=>el.remove(), 250); }, 2200);
}

/* ================= LOCK SCREEN ================= */
function renderLock(){
  const app = document.getElementById('app');
  app.classList.remove('shell');
  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-brand">
        <img class="lock-badge" src="./icon-192.png" alt="Mello Hub">
        <div class="lock-title">Mello Hub</div>
        <div class="lock-sub">Accès réservé à l'équipe Mello</div>
      </div>
      <div class="lock-panel">
        <div class="lock-field">
          <input type="password" id="lock-input" placeholder="Mot de passe" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="lock-error" id="lock-error"></div>
        <button class="btn btn-primary" id="lock-submit">${ICONS.unlock} Déverrouiller</button>
      </div>
    </div>
  `;
  const input = document.getElementById('lock-input');
  const errorEl = document.getElementById('lock-error');
  const panel = document.querySelector('.lock-panel');
  input.focus();

  async function attempt(){
    const value = input.value;
    if(!value) return;
    const hash = await sha256Hex(value);
    if(hash === ACCESS_HASH){
      localStorage.setItem(STORAGE.unlocked, 'true');
      state.currentView = 'dashboard';
      saveJSON(STORAGE.view, 'dashboard');
      renderShell();
      resetInactivityTimer();
    }else{
      errorEl.textContent = 'Mot de passe incorrect.';
      panel.classList.remove('lock-shake'); void panel.offsetWidth; panel.classList.add('lock-shake');
      input.value=''; input.focus();
    }
  }
  document.getElementById('lock-submit').addEventListener('click', attempt);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') attempt(); });
}

function lockApp(){
  localStorage.removeItem(STORAGE.unlocked);
  sessionStorage.removeItem(STORAGE.unlocked);
  clearTimeout(inactivityTimer);
  renderLock();
}

/* ---------------- Export / import des données ---------------- */
function exportAppData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    offres: state.offres,
    omnibusProducts: state.omnibusProducts,
    dayMarkers: state.dayMarkers
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mello-hub-export-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Export téléchargé', 'success');
}

function triggerImport(){
  const input = document.getElementById('import-file-input');
  if(input) input.click();
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('invalid');
      if(Array.isArray(data.offres)) saveJSON(STORAGE.offres, data.offres);
      if(Array.isArray(data.omnibusProducts)) saveJSON(STORAGE.omnibus, data.omnibusProducts);
      if(Array.isArray(data.dayMarkers)) saveJSON(STORAGE.dayMarkers, data.dayMarkers);
      toast('Données importées', 'success');
      setTimeout(() => location.reload(), 500);
    }catch(err){
      toast('Fichier invalide', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------------- Verrouillage automatique après inactivité ---------------- */
const INACTIVITY_LIMIT_MS = 5 * 60 * 1000; // 5 minutes
let inactivityTimer = null;
function resetInactivityTimer(){
  if(!isUnlocked()) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    lockApp();
  }, INACTIVITY_LIMIT_MS);
}
['click','keydown','mousemove','touchstart','scroll'].forEach(evt => {
  document.addEventListener(evt, resetInactivityTimer, { passive:true });
});

function navigateToOffer(offerId){
  const o = state.offres.find(x => x.id === offerId);
  if(!o) return;
  const d = parseDate(o.start);
  state.calMonth = { y: d.getFullYear(), m: d.getMonth() };

  `;

    checkForUpdate(false);
  }
  if(!state._autoSyncChecked){
    state._autoSyncChecked = true;
    if(getSyncToken()) performSync(false);

function positionPill(skipTransition){
  const pill = document.getElementById('nav-pill');
  const nav = document.getElementById('nav');
  const active = nav.querySelector('.nav-item.active');
  if(!pill || !nav) return;
  if(!active){ pill.style.opacity = '0'; return; }
  pill.style.opacity = '1';
  if(skipTransition) pill.style.transition = 'none';
  const itemRect = active.getBoundingClientRect();
  const parentRect = nav.getBoundingClientRect();
  pill.style.width = itemRect.width + 'px';
  pill.style.height = itemRect.height + 'px';
  pill.style.transform = `translate(${itemRect.left - parentRect.left}px, ${itemRect.top - parentRect.top}px)`;
  if(skipTransition){
    void pill.offsetWidth;
    pill.style.transition = 'transform .25s cubic-bezier(.4,0,.2,1), width .2s ease, height .2s ease';
  }
}

/* ================= RENDER: VIEW ROUTER ================= */
function renderView(animate){
  const main = document.getElementById('main');
  if(state.currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(state.currentView === 'offres') main.innerHTML = renderOffres();
  else if(state.currentView === 'omnibus'){
    main.innerHTML = renderOmnibus();
    document.querySelectorAll('.product-name-input, .variant-name-input').forEach(autosizeInput);
  }
  else if(state.currentView === 'reglages'){
    main.innerHTML = renderReglages();
    const importInput = document.getElementById('import-file-input');
    if(importInput) importInput.addEventListener('change', handleImportFile);
  }
  if(animate){
    main.classList.remove('view-fade'); void main.offsetWidth; main.classList.add('view-fade');
  }
}

function renderOffresCalendar(){
  const { y, m } = state.calMonth;
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({ day: daysInPrevMonth - startOffset + i + 1, outside:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ day:d, outside:false });
  while(cells.length % 7 !== 0) cells.push({ day: cells.length, outside:true });

  const today = todayStr();
  function dateStrOf(cell){
    if(cell.outside) return null;
    const dd = String(cell.day).padStart(2,'0'); const mm = String(m+1).padStart(2,'0');
    return `${y}-${mm}-${dd}`;
  }
  const offersOnDay = (ds) => state.offres.filter(o => o.start <= ds && o.end >= ds)
    .sort((a,b) => a.start.localeCompare(b.start) || a.id.localeCompare(b.id));
  const markersOnDay = (ds) => state.dayMarkers.filter(mk => mk.startDate <= ds && (mk.endDate || mk.startDate) >= ds);

  const selectedDay = state.calSelected;
  const selectedOffers = selectedDay ? offersOnDay(selectedDay) : [];
  const selectedMarkers = selectedDay ? markersOnDay(selectedDay) : [];

  return `
    <div class="card cal-card">
      <div class="cal-head">
        <h3>${MONTHS_FR[m]} ${y}</h3>
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev">${ICONS.chevronL}</button>
          <button class="btn btn-ghost" data-action="cal-today" style="padding:.4rem .75rem;font-size:.75rem;">Aujourd'hui</button>
          <button class="icon-btn" data-action="cal-next">${ICONS.chevronR}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW_FR.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map((cell, i) => {
          if(cell.outside) return `<div class="cal-day outside"><div class="cal-day-top"><span class="cal-day-num">${cell.day}</span></div></div>`;
          const ds = dateStrOf(cell);
          const dayOffers = offersOnDay(ds);
          const dayMarkers = markersOnDay(ds);
          const isToday = ds === today;
          const isSelected = ds === selectedDay;
          const visibleOffers = dayOffers.slice(0, 2);
          const extraOffers = dayOffers.length - visibleOffers.length;
          const visibleMarkers = dayMarkers.slice(0, 5);
          const extraMarkers = dayMarkers.length - visibleMarkers.length;

          const weekdayIndex = i % 7;
          const prevCell = weekdayIndex > 0 ? cells[i-1] : null;
          const nextCell = weekdayIndex < 6 ? cells[i+1] : null;
          const prevOfferIds = (prevCell && !prevCell.outside) ? new Set(offersOnDay(dateStrOf(prevCell)).map(o=>o.id)) : new Set();
          const nextOfferIds = (nextCell && !nextCell.outside) ? new Set(offersOnDay(dateStrOf(nextCell)).map(o=>o.id)) : new Set();

          return `<div class="cal-day${isToday?' today':''}${isSelected?' selected':''}" data-action="cal-select" data-date="${ds}">
            <div class="cal-day-top"><span class="cal-day-num">${cell.day}</span></div>
            <div class="cal-day-offers">
              ${visibleOffers.map(o => {
                const isCapLeft = !prevOfferIds.has(o.id);
                const isCapRight = !nextOfferIds.has(o.id);
                const showLabel = isCapLeft;
                const cls = `cal-offer-chip${isCapLeft?' cap-left':''}${isCapRight?' cap-right':''}`;
                return `<div class="${cls}" style="background:${softenColor(o.color, 0.82)};color:${o.color}">${showLabel ? `${o.icon ? escapeHtml(o.icon)+' ' : ''}${escapeHtml(o.title)}` : ''}</div>`;
              }).join('')}
              ${extraOffers > 0 ? `<div class="cal-offer-more">+${extraOffers} autre${extraOffers>1?'s':''}</div>` : ''}
            </div>
            ${dayMarkers.length ? `<div class="cal-day-markers">
              ${visibleMarkers.map(mk => { const type = MARKER_TYPES.find(t => t.id === mk.icon) || MARKER_TYPES[3]; return `<span class="cal-marker-dot" style="background:${mk.color || 'var(--accent)'}" title="${escapeHtml(mk.label || type.label)}">${type.icon}</span>`; }).join('')}
              ${extraMarkers > 0 ? `<span class="cal-marker-more">+${extraMarkers}</span>` : ''}
            </div>` : ''}
            ${(dayOffers.length || dayMarkers.length) ? `
              <div class="cal-day-popover${weekdayIndex<=1?' align-start':weekdayIndex>=5?' align-end':''}">
                <div class="cal-popover-date">${cell.day} ${MONTHS_FR[m]}</div>
                ${dayOffers.map(o => `
                  <div class="cal-popover-offer">
                    <div class="cal-popover-row"><span class="cal-popover-dot" style="background:${o.color}"></span><strong>${o.icon ? escapeHtml(o.icon)+' ' : ''}${escapeHtml(o.title)}</strong></div>
                    <div class="cal-popover-meta">${fmtDate(o.start)} → ${fmtDate(o.end)}</div>
                    ${o.items && o.items.length ? o.items.map(it => `<div class="cal-popover-meta">${ICONS.tag} ${escapeHtml(it.product||'—')}${it.promotion ? ` <strong style="color:var(--alert);">${escapeHtml(it.promotion)}</strong>` : ''}</div>`).join('') : ''}
                    ${o.note ? `<div class="cal-popover-meta">${ICONS.note} ${escapeHtml(o.note)}</div>` : ''}
                  </div>
                `).join('')}
                ${dayMarkers.length ? `<div class="cal-popover-sep"></div>` : ''}
                ${dayMarkers.map(mk => { const type = MARKER_TYPES.find(t => t.id === mk.icon) || MARKER_TYPES[3]; return `<div class="cal-popover-row muted"><span class="cal-popover-dot" style="background:${mk.color || 'var(--accent)'}"></span>${escapeHtml(mk.label || type.label)}</div>`; }).join('')}
              </div>
            ` : ''}
          </div>`;
        }).join('')}
      </div>
      ${selectedDay ? renderDayDetail(selectedDay, selectedOffers, selectedMarkers) : ''}
    </div>
  `;
}

function offerProgress(o){
  const t = todayStr();
  if(t < o.start){
    const days = daysBetween(t, o.start);
    return { pct: 0, label: `débute dans ${days} j` };
  }
  if(t > o.end) return { pct: 100, label: 'Terminée' };
  const total = daysBetween(o.start, o.end) + 1;
  const elapsed = daysBetween(o.start, t) + 1;
  const pct = Math.round((elapsed/total) * 100);
  const remaining = daysBetween(t, o.end);
  return { pct, label: remaining <= 0 ? 'dernier jour' : `${remaining} j restant${remaining>1?'s':''}` };
}

/* Adoucit une couleur hex en la mélangeant avec du blanc — utilisé pour les
   remplissages de jour du calendrier, afin de garder les teintes vives comme
   identifiants (puces, pastilles) mais des fonds de case beaucoup plus doux. */
function softenColor(hex, amount = 0.72){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  const mix = (c) => Math.round(c + (255 - c) * amount);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

}

  document.querySelectorAll('.emoji-suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => { document.getElementById('f-icon').value = btn.dataset.emoji; });
  });
  root._getIcon = () => document.getElementById('f-icon').value.trim();

  const itemsList = document.getElementById('f-items-list');
  function addItemRow(item){
    const row = document.createElement('div');
    row.className = 'offer-item-row';
    row.dataset.id = (item && item.id) ? item.id : uid();
    row.innerHTML = `
      <input type="text" class="offer-item-input" data-field="product" placeholder="Ex. Matelas Relax" value="${item ? escapeHtml(item.product||'') : ''}">
      <input type="text" class="offer-item-input" data-field="promotion" placeholder="Ex. -30%" value="${item ? escapeHtml(item.promotion||'') : ''}">
      <button type="button" class="icon-btn danger item-remove" title="Supprimer">${ICONS.trash}</button>
    `;
    row.querySelector('.item-remove').addEventListener('click', () => row.remove());
    itemsList.appendChild(row);
  }
  initialItems.forEach(addItemRow);
  document.getElementById('f-item-add-btn').addEventListener('click', () => addItemRow(null));
  root._getItems = () => Array.from(itemsList.querySelectorAll('.offer-item-row')).map(row => ({
    id: row.dataset.id,
    product: row.querySelector('[data-field="product"]').value.trim(),
    promotion: row.querySelector('[data-field="promotion"]').value.trim()
  })).filter(it => it.product || it.promotion);
}

function closeModal(){
  const backdrop = document.querySelector('.modal-backdrop');
  if(!backdrop) return;
  backdrop.classList.remove('open');
  setTimeout(() => { document.getElementById('modal-root').innerHTML=''; }, 200);
}

function saveOfferFromModal(id){
  const title = document.getElementById('f-title').value.trim();
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const note = document.getElementById('f-note').value.trim();
  const modalRoot = document.getElementById('modal-root');
  const color = modalRoot._getColor ? modalRoot._getColor() : OFFER_COLORS[0];
  const icon = modalRoot._getIcon ? modalRoot._getIcon() : '';
  const items = modalRoot._getItems ? modalRoot._getItems() : [];
  if(!title){ toast('Merci de renseigner un titre', 'error'); return; }
  if(!start || !end || end < start){ toast('Les dates ne sont pas valides', 'error'); return; }
  if(id){
    const o = state.offres.find(x => x.id === id);
    Object.assign(o, { title, start, end, color, note, icon, items });
    delete o.tag; delete o.subOffers; delete o.products; delete o.promotions;
    toast('Offre mise à jour', 'success');
  }else{
    state.offres.push({ id: uid(), title, start, end, color, note, icon, items });
    toast('Offre créée', 'success');
  }
  persistOffres();
  closeModal();
  renderView();
}

function deleteOffer(id){
  state.offres = state.offres.filter(o => o.id !== id);
  persistOffres();
  closeModal();
  renderView();
  toast('Offre supprimée');
}

function duplicateOffer(id){
  const o = state.offres.find(x => x.id === id);
  if(!o) return;
  const copy = {
    ...o,
    id: uid(),
    title: o.title + ' (copie)',
    items: (o.items || []).map(it => ({ ...it, id: uid() }))
  };
  state.offres.push(copy);
  persistOffres();
  renderView();
  toast('Offre dupliquée', 'success');
}

function renderOmnibus(){
  reconcileExpiredPromos();
  return `

function renderOmniProductCard(p, index, total){
  return `
    <div class="card" style="margin-bottom:.6rem;padding:.8rem 1rem;">

function radialProgress(pct, color){
  const clamped = Math.max(0, Math.min(100, pct));
  return `<span class="promo-radial" style="background:conic-gradient(${color} ${clamped}%, var(--border) 0)"></span>`;
}

function renderVariantRow(p, v){
  const isPromo = v.currentStatus === 'promo';
  const warnDays = variantComplianceWarning(v);
  const expanded = !!(state.omniExpanded && state.omniExpanded[v.id]);

  let percentVal = '—', startVal = '—', endVal = '—', remainingHtml = '<span class="variant-field-value muted">—</span>';
  if(isPromo){
    percentVal = `-${v.promoPercent || '?'}%`;
    if(v.promoStart && v.promoEnd){
      startVal = fmtDate(v.promoStart);
      endVal = fmtDate(v.promoEnd);
      const totalDays = daysBetween(v.promoStart, v.promoEnd) + 1;
      const elapsed = Math.max(0, daysBetween(v.promoStart, todayStr()) + 1);
      const pct = Math.min(100, Math.round((elapsed/totalDays)*100));
      const remaining = daysBetween(todayStr(), v.promoEnd);
      remainingHtml = `<span class="variant-field-value">${radialProgress(pct, 'var(--alert)')}${remaining<=0?'dernier j.':remaining+' j'}</span>`;
    } else {
      startVal = fmtDate(v.statusSince);
    }
  }
  const normalDuration = daysBetween(v.statusSince, todayStr());

  return `
    <div class="variant-row">
      <div class="variant-top">
        <div class="variant-top-left">
          <input class="variant-name-input" value="${escapeHtml(v.name)}" data-action="rename-variant" data-product="${p.id}" data-variant="${v.id}">
          <span class="badge${isPromo?' badge-halo':''}" style="color:${isPromo?'var(--alert)':'var(--muted)'};background:${isPromo?'var(--alert-soft)':'var(--surface)'}">${isPromo?'Promo active':'Promo désactivée'}</span>
        </div>
        <div class="variant-actions">
          ${isPromo ? `<button class="icon-btn" data-action="edit-variant-promo" data-product="${p.id}" data-variant="${v.id}" title="Modifier la promo">${ICONS.edit}</button>` : ''}
          <button class="icon-btn" data-action="toggle-variant-history" data-variant="${v.id}" title="Historique">${ICONS.clock}${v.history.length>1?` ${v.history.length}`:''}</button>
          <button class="icon-btn" data-action="duplicate-variant" data-product="${p.id}" data-variant="${v.id}" title="Dupliquer">${ICONS.copy}</button>
          <button class="icon-btn danger" data-action="delete-variant" data-product="${p.id}" data-variant="${v.id}" title="Supprimer">${ICONS.trash}</button>
          <button class="btn ${isPromo?'btn-ghost':'btn-positive'} btn-sm variant-toggle-btn" data-action="toggle-variant-status" data-product="${p.id}" data-variant="${v.id}">${isPromo?'Annuler la promo':'Activer une promo'}</button>
        </div>
      </div>
      <div class="variant-fields">
        <div class="variant-field">
          <span class="variant-field-label">Réduction</span>
          <span class="variant-field-value${isPromo?' percent':' muted'}">${percentVal}</span>
        </div>
        <div class="variant-field">
          <span class="variant-field-label">Début</span>
          <span class="variant-field-value${isPromo?'':' muted'}">${startVal}</span>
        </div>
        <div class="variant-field">
          <span class="variant-field-label">Fin</span>
          <span class="variant-field-value${isPromo?'':' muted'}">${endVal}</span>
        </div>
        <div class="variant-field">
          <span class="variant-field-label">Restant</span>
          ${remainingHtml}
        </div>
        ${!isPromo ? `<div class="variant-field variant-field-grow"><span class="variant-field-label">Statut</span><span class="variant-field-value muted">Depuis ${normalDuration} j</span></div>` : ''}
      </div>
      ${expanded ? `
        <div class="variant-history">
          ${[...v.history].reverse().map(h => `<div class="variant-history-item"><span>${fmtDateLong(h.date)}</span><span>${h.status==='promo'?`Promo -${h.percent||'?'}%${h.end?` jusqu'au ${fmtDate(h.end)}`:''}`:'Retour au prix normal'}</span></div>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function variantComplianceWarning(v){
  if(v.currentStatus !== 'promo') return null;
  const hist = v.history;
  if(hist.length < 2) return null;
  const prev = hist[hist.length - 2];
  if(prev.status !== 'normal') return null;
  const normalDuration = daysBetween(prev.date, v.statusSince);
  return normalDuration < 30 ? normalDuration : null;
}

function findVariant(productId, variantId){
  const p = state.omnibusProducts.find(x => x.id === productId);
  if(!p) return null;
  const v = p.variants.find(x => x.id === variantId);
  return v ? { product: p, variant: v } : null;
}

/* ---- Modale d'activation de promo (pourcentage + durée) ---- */
function openVariantPromoModal(productId, variantId){
  const found = findVariant(productId, variantId);
  if(!found) return;
  const { product, variant } = found;
  const isEditing = variant.currentStatus === 'promo';
  const defaultDuration = 14;
  const initialStart = isEditing && variant.promoStart ? variant.promoStart : todayStr();
  const initialEnd = isEditing && variant.promoEnd ? variant.promoEnd : addDaysStr(todayStr(), defaultDuration-1);
  const initialDuration = daysBetween(initialStart, initialEnd) + 1;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="promo-backdrop">
      <div class="modal">
        <h3 class="modal-title">Promotion sur ${escapeHtml(product.name)} ${escapeHtml(variant.name)}</h3>
        <div class="field">
          <label>Réduction</label>
          <div class="promo-percent-wrap">
            <input type="number" id="f-promo-percent" min="1" max="99" placeholder="Ex. 30" value="${isEditing && variant.promoPercent ? variant.promoPercent : ''}">
            <span class="promo-percent-suffix">%</span>
          </div>
        </div>
        <div class="field">
          <label>Durée de l'offre (jours)</label>
          <input type="number" id="f-promo-duration" min="1" value="${initialDuration}">
        </div>
        <div class="field field-row">
          <div>
            <label>Début</label>
            <input type="date" id="f-promo-start" value="${initialStart}">
          </div>
          <div>
            <label>Fin</label>
            <input type="date" id="f-promo-end" value="${initialEnd}">
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-modal">Annuler</button>
          <button class="btn btn-primary" data-action="save-variant-promo" data-product="${productId}" data-variant="${variantId}">${ICONS.check} ${isEditing ? 'Enregistrer' : 'Activer une promo'}</button>
        </div>
      </div>
    </div>
  `;
  requestAnimationFrame(() => document.getElementById('promo-backdrop').classList.add('open'));

  const startInput = document.getElementById('f-promo-start');
  const endInput = document.getElementById('f-promo-end');
  const durationInput = document.getElementById('f-promo-duration');

  function endFromDuration(){
    const dur = parseInt(durationInput.value, 10);
    if(dur > 0 && startInput.value) endInput.value = addDaysStr(startInput.value, dur - 1);
  }
  function durationFromEnd(){
    if(startInput.value && endInput.value && endInput.value >= startInput.value){
      durationInput.value = daysBetween(startInput.value, endInput.value) + 1;
    }
  }
  startInput.addEventListener('change', endFromDuration);
  durationInput.addEventListener('input', endFromDuration);
  endInput.addEventListener('change', durationFromEnd);
}

function saveVariantPromoFromModal(productId, variantId){
  const found = findVariant(productId, variantId);
  if(!found) return;
  const { variant } = found;
  const wasPromo = variant.currentStatus === 'promo';
  const percent = parseInt(document.getElementById('f-promo-percent').value, 10);
  const start = document.getElementById('f-promo-start').value;
  const end = document.getElementById('f-promo-end').value;
  if(!percent || percent <= 0){ toast('Merci de renseigner une réduction', 'error'); return; }
  if(!start || !end || end < start){ toast('Les dates ne sont pas valides', 'error'); return; }
  variant.currentStatus = 'promo';
  variant.promoPercent = percent;
  variant.promoStart = start;
  variant.promoEnd = end;
  variant.statusSince = start;
  const last = variant.history[variant.history.length - 1];
  if(wasPromo && last && last.status === 'promo'){
    last.date = start; last.percent = percent; last.start = start; last.end = end;
  } else {
    variant.history.push({ date: start, status:'promo', percent, start, end });
  }
  persistOmnibus();
  closeModal();
  renderView();
  toast(wasPromo ? 'Promotion mise à jour' : 'Variante mise en promotion', 'success');
}

function endVariantPromo(productId, variantId){
  const found = findVariant(productId, variantId);
  if(!found) return;
  const { variant } = found;
  const today = todayStr();
  variant.currentStatus = 'normal';
  variant.statusSince = today;
  variant.promoPercent = null; variant.promoStart = null; variant.promoEnd = null;
  variant.history.push({ date: today, status:'normal' });
  persistOmnibus();
  renderView();
  toast('Variante repassée au prix normal', 'success');
}

function toggleVariantStatus(productId, variantId){
  const found = findVariant(productId, variantId);
  if(!found) return;
  if(found.variant.currentStatus === 'promo') endVariantPromo(productId, variantId);
  else openVariantPromoModal(productId, variantId);
}

function moveProductUp(productId){
  const i = state.omnibusProducts.findIndex(p => p.id === productId);
  if(i <= 0) return;
  [state.omnibusProducts[i-1], state.omnibusProducts[i]] = [state.omnibusProducts[i], state.omnibusProducts[i-1]];
  persistOmnibus(); renderView();
}
function moveProductDown(productId){
  const i = state.omnibusProducts.findIndex(p => p.id === productId);
  if(i === -1 || i >= state.omnibusProducts.length - 1) return;
  [state.omnibusProducts[i+1], state.omnibusProducts[i]] = [state.omnibusProducts[i], state.omnibusProducts[i+1]];
  persistOmnibus(); renderView();
}

function deleteProduct(productId){

}
function duplicateProduct(productId){

  const copy = {
    id: uid(),

  state.omnibusProducts.push(copy);

function addVariant(productId){
  const p = state.omnibusProducts.find(x => x.id === productId);
  if(!p) return;
  p.variants.push({ id: uid(), name:'Nouvelle variante', currentStatus:'normal', statusSince:todayStr(), promoPercent:null, promoStart:null, promoEnd:null, history:[{date:todayStr(), status:'normal'}] });
  persistOmnibus(); renderView();
}
function deleteVariant(productId, variantId){
  const p = state.omnibusProducts.find(x => x.id === productId);
  if(!p) return;
  p.variants = p.variants.filter(v => v.id !== variantId);

function duplicateVariant(productId, variantId){

  const v = p.variants.find(x => x.id === variantId);

function toggleVariantHistory(variantId){

}

          <div class="settings-row">
            <div>
              <div class="settings-label">Déconnecter ce Mac</div>
              <div class="settings-sub">Retire le token de cet appareil — n'efface pas les données déjà synchronisées sur GitHub.</div>
            </div>
            <button class="btn btn-ghost" style="--btn-color:var(--negative)" data-action="disconnect-sync">Déconnecter</button>
          </div>
        `}
      </div>

      <div class="card">
        <div class="section-title">Données</div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Exporter les données</div>
            <div class="settings-sub">Télécharge une sauvegarde (offres, Omnibus, repères) au format JSON</div>
          </div>
          <button class="btn btn-ghost" data-action="export-data">${ICONS.download} Exporter</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">Importer des données</div>
            <div class="settings-sub">Restaure une sauvegarde exportée depuis Mello Hub. Remplace les données actuelles.</div>
          </div>
          <div>
            <button class="btn btn-ghost" data-action="trigger-import">${ICONS.upload} Importer</button>
            <input type="file" id="import-file-input" accept="application/json" style="display:none;">
          </div>
        </div>
      </div>
    </div>

    <div style="text-align:center;padding:1.6rem 0 .5rem;color:var(--muted);font-size:.72rem;">
      Mello 2026 - outil interne - en cours de développement
    </div>
  `;
}

/* ================= EVENTS ================= */
function attachGlobalHandlers(){
  document.body.onclick = null; // avoid duplicate binding across re-shells
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('input', handleInput);
  window.addEventListener('resize', () => positionPill(true));
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el){
    if(e.target.id === 'offer-backdrop') closeModal();
    return;
  }
  const action = el.dataset.action;

  if(action === 'go-view'){
    state.currentView = el.dataset.view;
    saveJSON(STORAGE.view, state.currentView);
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    positionPill(false);
    renderView(true);
  }
  else if(action === 'goto-offer') navigateToOffer(el.dataset.id);
  else if(action === 'open-offer-modal') openOfferModal(null);
  else if(action === 'open-offer-modal-for-date') openOfferModal(null, el.dataset.date);
  else if(action === 'edit-offer') openOfferModal(el.dataset.id);
  else if(action === 'delete-offer') deleteOffer(el.dataset.id);
  else if(action === 'duplicate-offer') duplicateOffer(el.dataset.id);
  else if(action === 'save-offer') saveOfferFromModal(el.dataset.id || null);
  else if(action === 'close-modal') closeModal();
  else if(action === 'offres-view'){ state.offresViewMode = el.dataset.mode; renderView(); }
  else if(action === 'cal-prev'){ shiftMonth(-1); }
  else if(action === 'cal-next'){ shiftMonth(1); }
  else if(action === 'cal-today'){ const n = new Date(); state.calMonth = { y:n.getFullYear(), m:n.getMonth() }; state.calSelected = todayStr(); renderView(); }
  else if(action === 'cal-select'){ state.calSelected = state.calSelected === el.dataset.date ? null : el.dataset.date; renderView(); }
  else if(action === 'open-marker-modal') openMarkerModal(el.dataset.date);
  else if(action === 'edit-marker') openMarkerModal(null, el.dataset.id);
  else if(action === 'save-marker') saveMarkerFromModal(el.dataset.id || null);
  else if(action === 'delete-marker'){ deleteDayMarker(el.dataset.id); closeModal(); }
  else if(action === 'add-product') addProduct();
  else if(action === 'delete-product') deleteProduct(el.dataset.product);
  else if(action === 'duplicate-product') duplicateProduct(el.dataset.product);
  else if(action === 'move-product-up') moveProductUp(el.dataset.product);
  else if(action === 'move-product-down') moveProductDown(el.dataset.product);
  else if(action === 'add-variant') addVariant(el.dataset.product);
  else if(action === 'delete-variant') deleteVariant(el.dataset.product, el.dataset.variant);
  else if(action === 'duplicate-variant') duplicateVariant(el.dataset.product, el.dataset.variant);
  else if(action === 'toggle-variant-status') toggleVariantStatus(el.dataset.product, el.dataset.variant);
  else if(action === 'edit-variant-promo') openVariantPromoModal(el.dataset.product, el.dataset.variant);
  else if(action === 'save-variant-promo') saveVariantPromoFromModal(el.dataset.product, el.dataset.variant);
  else if(action === 'toggle-variant-history') toggleVariantHistory(el.dataset.variant);
  else if(action === 'lock-app') lockApp();
  else if(action === 'confirm-reset-data') openResetConfirmModal();
  else if(action === 'export-data') exportAppData();
  else if(action === 'trigger-import') triggerImport();
  else if(action === 'save-sync-token') saveSyncTokenFromInput();
  else if(action === 'run-sync') performSync(true);
  else if(action === 'disconnect-sync') disconnectSync();
  else if(action === 'reset-app-data') resetAppData();
  else if(action === 'check-update') checkForUpdate(true);
  else if(action === 'apply-update') applyUpdate();
  else if(action === 'toggle-changelog'){ state.showChangelog = !state.showChangelog; renderView(); }
}

function handleInput(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'rename-product'){
    const p = state.omnibusProducts.find(x => x.id === el.dataset.product);
    if(p){ p.name = el.value; persistOmnibus(); }
    autosizeInput(el);
  }
  else if(action === 'rename-variant'){
    const found = findVariant(el.dataset.product, el.dataset.variant);
    if(found){ found.variant.name = el.value; persistOmnibus(); }
    autosizeInput(el);
  }
}

function shiftMonth(delta){
  let { y, m } = state.calMonth;
  m += delta;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  state.calMonth = { y, m };
  renderView();
}

/* ================= INIT ================= */
reconcileExpiredPromos();
if(isUnlocked()){ renderShell(); resetInactivityTimer(); } else renderLock();
</script>
</body>
</html>
